<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambar Furniture — Setup</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#222}input,button{font-size:16px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box}button{background:#1a73e8;color:#fff;border:0;border-radius:8px}h2{margin-top:28px}pre{background:#f4f4f4;padding:10px;border-radius:8px;white-space:pre-wrap}.ok{color:#0a7d2c}.bad{color:#c62828}</style></head><body>
<h1>Setup &amp; checks</h1>
<input id="key" type="password" placeholder="Setup key (ADMIN_SETUP_KEY from Render)">
<button onclick="status()">1. Check status</button><pre id="status">—</pre>
<h2>2. Log in the admin account</h2>
<input id="phone" placeholder="Admin phone, e.g. +2519XXXXXXXX"><button onclick="sendCode()">Send code</button>
<input id="code" placeholder="Code from Telegram"><input id="pw" type="password" placeholder="2-step password (only if you have one)"><button onclick="verify()">Verify</button>
<h2>3. Test</h2>
<input id="target" placeholder="@username or +phone of someone to test"><button onclick="test()">Send test message</button>
<pre id="out"></pre>
<script>
const $=i=>document.getElementById(i);
async function call(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify({key:$("key").value,...body}):undefined});return r.json()}
const show=d=>{$("out").className=d.ok?"ok":"bad";$("out").textContent=(d.message||d.error||JSON.stringify(d))};
async function status(){const d=await call("/api/setup/status?key="+encodeURIComponent($("key").value));if(!d.ok){$("status").textContent=d.error;return}
const l=(n,v)=>(v?"✅ ":"❌ ")+n;$("status").textContent=[l("BOT_TOKEN",d.botToken),l("ADMIN_CHAT_ID",d.adminChatId),l("Supabase",d.supabase),l("TG_API_ID",d.tgApiId),l("TG_API_HASH",d.tgApiHash),l("Admin account logged in",d.adminAccountLoggedIn)+(d.adminAccountError?" — "+d.adminAccountError:""),l("Webhook set",!!d.webhookUrl)+(d.webhookError?" — last error: "+d.webhookError:""),l("Business connections usable: "+d.usableBusinessConnections+"/"+d.businessConnections,d.usableBusinessConnections>0),"Known customers: "+d.knownCustomers].join("\n")}
async function sendCode(){show(await call("/api/setup/send-code",{phone:$("phone").value}))}
async function verify(){show(await call("/api/setup/verify",{code:$("code").value,password:$("pw").value}));status()}
async function test(){show(await call("/api/setup/test",{target:$("target").value}))}
</script></body></html>
