<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f3d30">
<title>Ambar Furniture — Products</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch{}
(function(){const f=window.fetch;window.fetch=function(u,o){o=o||{};if(typeof u==="string"&&u.startsWith("/api/")){const h=new Headers(o.headers||{});let id="";try{id=Telegram.WebApp.initData||"";}catch{}if(id)h.set("X-Telegram-Init-Data",id);let k="";try{k=localStorage.getItem("ownerKey")||"";}catch{}if(k)h.set("X-Setup-Key",k);o.headers=h;}return f.call(this,u,o);};})();
</script>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#14231e;--muted:#6b7680;--line:#e8ebf0;--brand:#0f3d30;--brand2:#17604b;--gold:#e0b22e;--ok:#17824c;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fde8e6;--warn:#8a5a00;--warnbg:#fff1d4;--blue:#14598f;--bluebg:#e5f1fb;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px rgba(16,24,40,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0a2a20,var(--brand) 55%,var(--brand2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;box-shadow:0 6px 24px rgba(8,30,22,.25)}
header .in{max-width:820px;margin:auto;display:flex;align-items:center;gap:12px}
header a.back{color:#fff;text-decoration:none;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 13px;white-space:nowrap}
header h1{margin:0;font-size:18px;line-height:1.15}header .sub{font-size:11.5px;opacity:.7;margin-top:2px}
main{max-width:820px;margin:auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:15.5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:2px 0 8px}
.msg{display:none;border-radius:13px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:12px;line-height:1.5;border:1px solid transparent}
.msg.ok{display:block;background:var(--okbg);color:var(--ok);border-color:#bfe6cf}.msg.bad{display:block;background:var(--badbg);color:var(--bad);border-color:#f4c4c0}.msg.warn{display:block;background:var(--warnbg);color:var(--warn);border-color:#ecd49a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 15px;font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-family:inherit}
.btn.sec{background:#edf0f4;color:var(--brand)}.btn.gold{background:linear-gradient(135deg,#f0cd6a,var(--gold));color:#2f2100}.btn.red{background:var(--badbg);color:var(--bad)}.btn.sm{padding:8px 11px;font-size:12.5px;border-radius:10px}.btn.block{width:100%}.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid #e1e5eb;border-radius:12px;padding:11px 12px;font-size:15px;background:#fbfcfd;color:var(--ink);font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(23,96,75,.12)}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:12.5px;font-weight:700;margin:10px 0 4px}
.seg{display:flex;gap:6px;margin-bottom:14px}.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 4px;font-weight:700;font-size:13px;color:var(--brand);cursor:pointer;font-family:inherit}.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;background:#eef0f3;color:#56606a}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.wait{background:var(--warnbg);color:var(--warn)}.pill.blue{background:var(--bluebg);color:var(--blue)}
.vt{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}.vt button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}.vt button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bigGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.bigc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;position:relative}.bigc .ph{width:100%;aspect-ratio:1;object-fit:cover;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:44px}.bigc img.ph{display:block}.bigc .bd{padding:9px 10px 10px}.bigc .t{font-weight:800;font-size:14px}.bigc .m{font-size:12px;color:var(--muted);margin:3px 0 8px;line-height:1.4}.bigc .chk{position:absolute;top:8px;left:8px;width:22px;height:22px}.bigc .btns{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.it{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.it:last-child{border-bottom:0}
.it .th{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#eef0f3;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.it .mid{flex:1;min-width:0}.it .t{font-weight:800;font-size:14.5px;word-break:break-word}.it .m{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.it .rt{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.empty{text-align:center;color:var(--muted);padding:26px 8px;font-size:13.5px;line-height:1.6}
.pill.wait2{background:var(--warnbg);color:var(--warn)}
.grp{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.grp b{font-size:15px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.sheet .hd b{font-size:17px}.sheet .x{border:0;background:#eef0f3;border-radius:50%;width:34px;height:34px;font-size:17px;font-weight:800;cursor:pointer}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:13px;margin-top:8px;cursor:pointer;font-weight:700;font-size:14px}.opt.on{border-color:var(--brand2);background:#eef8f3}.opt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pv{display:flex;gap:12px;align-items:center}.pv img,.pv .ph0{width:84px;height:84px;border-radius:14px;object-fit:cover;background:#eef0f3;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.chk{width:22px;height:22px;flex:none;accent-color:var(--brand2)}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:8px;align-items:center;justify-content:space-between;z-index:20;box-shadow:0 -8px 24px rgba(16,24,40,.08)}.bar.on{display:flex}
#gate{display:none;position:fixed;inset:0;z-index:99;background:#0b1511;color:#fff;align-items:center;justify-content:center;padding:24px;text-align:center}

.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:10px 4px;font-weight:800;font-size:12.5px;color:var(--brand);cursor:pointer;font-family:inherit;line-height:1.3}.tabs button small{display:block;font-weight:700;font-size:11px;opacity:.75}.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px}.tools input{flex:1}
.vt{margin-left:0}.vt button{padding:8px 11px}
.sa{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);margin:2px 2px 10px}
.bigc{cursor:pointer}.bigc .chk{background:#fff;border-radius:6px}
.it{cursor:pointer}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pill.sold{background:var(--badbg);color:var(--bad)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0}.dl div span{display:block;font-size:11px;color:var(--muted);font-weight:700}.dl div b{font-size:13.5px;word-break:break-word}
.bigimg{width:100%;max-height:300px;object-fit:cover;border-radius:16px;background:#eef1f5;display:block;margin-bottom:6px}
</style></head>
<body>
<div id="gate"><div><h2>AMBAR Furniture</h2><p id="gateMsg">Checking your access…</p><a class="btn" href="/home.html" style="text-decoration:none">← Home</a></div></div>
<header><div class="in"><a class="back" href="/home.html">← Home</a><div style="flex:1;min-width:0"><h1>📊 Products</h1><div class="sub">Workshop · Stock · Sold — advance every product</div></div></div></header>
<main>
  <div class="msg" id="msg"></div>
  <div class="tabs" id="tabs"><button data-t="workshop">⏳ Workshop<small id="nW">0</small></button><button data-t="stock">📦 Stock<small id="nS">0</small></button><button data-t="sold">🔴 Sold<small id="nD">0</small></button></div>
  <div class="tools"><input type="text" id="q" placeholder="🔎 Code, model, type, handle…" autocomplete="off"><span class="vt"><button data-view="list">☰ List</button><button data-view="large">▦ Large</button></span></div>
  <div id="out"></div>
</main>
<div class="bar" id="bar"><b id="barTxt"></b><span style="display:flex;gap:8px"><button class="btn red" id="barDel" style="display:none">🗑 Delete</button><button class="btn" id="barGo">Advance</button></span></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let D=null,TAB="workshop",VIEW="list",SEL=new Set(),BUSY=false,CAN=true,OWNER=false,ONCLOSE=null;
try{const t=localStorage.getItem("prTab");if(["workshop","stock","sold"].includes(t))TAB=t;if(localStorage.getItem("prView")==="large")VIEW="large";}catch{}
const ACT={workshop:{label:"✅ Finished → Stock",bulk:"✅ Finished → Stock",ask:"Move to Stock? The product is finished in the workshop."},stock:{label:"🔴 Sold",bulk:"🔴 Sold → customer",ask:"Mark as Sold Out? It leaves the stock."},sold:{label:"♻️ Restock",bulk:"♻️ Restock",ask:"Restock? The product goes back In Stock."}};
const EMPTY={workshop:"<b>No product in the workshop.</b><br>Products you save in <b>Workshop → Standard / Custom</b> appear here until they are finished.",stock:"<b>Nothing in stock.</b><br>Finish a workshop product to move it here.",sold:"<b>No sold product.</b><br>Products marked sold appear here — you can restock them."};
async function api(path,body){try{const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let d={};try{d=await r.json();}catch{}if(r.status===401||(r.status===403&&d.code==="NO_PERMISSION")){gate(d.error||"No access.");}return d;}catch(e){return{ok:false,error:"Could not reach the server. Try again."};}}
function gate(t){$("gate").style.display="flex";$("gateMsg").textContent=t;}
function say(text,kind){const m=$("msg");m.className="msg "+(kind||"ok");m.textContent=text;m.scrollIntoView({block:"nearest"});if(kind!=="bad"&&kind!=="warn")setTimeout(()=>{if(m.textContent===text)m.className="msg";},6000);}
function open(h){$("sheet").innerHTML=h;$("ov").classList.add("on");}function close(){$("ov").classList.remove("on");if(ONCLOSE){const f=ONCLOSE;ONCLOSE=null;f();}}
$("ov").addEventListener("click",e=>{if(e.target===$("ov")||e.target.closest(".x"))close();});
function confirmBox(text,okLabel){return new Promise(res=>{open('<div class="hd"><b>Please confirm</b></div><p style="font-size:14.5px;line-height:1.6;white-space:pre-wrap">'+esc(text)+'</p><div class="btns"><button class="btn" id="cOk">'+esc(okLabel)+'</button><button class="btn sec" id="cNo">Cancel</button></div>');$("cOk").onclick=()=>{close();res(true);};$("cNo").onclick=()=>{close();res(false);};});}
const img=(p,cls)=>p.photo?'<img class="'+cls+'" loading="lazy" src="/api/reports-photo/'+esc(p.photo)+'.jpg" alt="" onerror="this.outerHTML=\'<div class=&quot;'+cls+'&quot;>🛋</div>\'">':'<div class="'+cls+'">🛋</div>';
const name=p=>p.code+(p.model?"-"+p.model:"");
const meta=p=>[p.ptype,p.desc,p.material&&("🧱 "+p.material),p.color&&("🎨 "+p.color),p.handle&&("🔧 "+p.handle),p.capacity&&("👟 "+p.capacity)].filter(Boolean).join(" · ")||"—";
const kind=p=>/CUS|ORD/i.test(p.orderType||"")?'<span class="pill wait">ORDER</span>':p.custom?'<span class="pill blue">🎨 Custom</span>':'<span class="pill ok">Standard</span>';
const stagePill=p=>TAB==="workshop"?((p.stage==="finishing"?'<span class="pill blue">🎨 In finishing</span>':'<span class="pill wait">🛠 In workshop</span>')+(p.sent?' <span class="pill">📤 '+esc(p.sent.at||"")+'</span>':'')):TAB==="sold"&&p.soldInfo?'<span class="pill sold">Sold '+esc(p.soldInfo.at||"")+'</span>'+(p.soldInfo.info?' <span class="pill blue">👤 '+esc(p.soldInfo.info)+'</span>':""):"";
const list=()=>D?D[TAB]:[];
function filtered(){const q=$("q").value.toLowerCase().trim();return list().filter(p=>!q||[p.code,p.model,p.ptype,p.desc,p.handle,p.color,p.material,p.capacity,p.note,p.salesName].join(" ").toLowerCase().includes(q));}
function card(p){const a=ACT[TAB],chk=CAN?'<input class="chk" type="checkbox" data-sel="'+esc(p.id)+'" '+(SEL.has(p.id)?"checked":"")+'>':"";
  const btn=CAN?'<button class="btn sm '+(TAB==="sold"?"sec":"")+'" data-adv="'+esc(p.id)+'">'+a.label+'</button>'+(OWNER?'<button class="btn sm red" data-del="'+esc(p.id)+'" title="Delete">🗑</button>':""):"";
  if(VIEW==="large")return'<div class="bigc" data-open="'+esc(p.id)+'">'+chk+img(p,"ph")+'<div class="bd"><div class="t">'+esc(name(p))+'</div><div class="m">'+esc(meta(p))+'</div><div class="tg">'+kind(p)+stagePill(p)+'</div><div class="btns" style="margin-top:8px">'+btn+'</div></div></div>';
  return'<div class="it" data-open="'+esc(p.id)+'">'+chk+img(p,"th")+'<div class="mid"><div class="t">'+esc(name(p))+'</div><div class="m">'+esc(meta(p))+'</div><div class="tg">'+kind(p)+stagePill(p)+'</div></div><div class="rt">'+btn+'</div></div>';}
function render(){
  if(!D)return;
  $("nW").textContent=D.counts.workshop;$("nS").textContent=D.counts.stock;$("nD").textContent=D.counts.sold;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===TAB));
  document.querySelectorAll(".vt button").forEach(b=>b.classList.toggle("on",b.dataset.view===VIEW));
  const L=filtered(),all=list(),ids=new Set(all.map(p=>p.id));for(const id of [...SEL])if(!ids.has(id))SEL.delete(id);
  const allOn=L.length&&L.every(p=>SEL.has(p.id));
  $("out").innerHTML=(CAN&&L.length?'<label class="sa"><input class="chk" type="checkbox" id="selAll" '+(allOn?"checked":"")+'> Select all ('+L.length+')</label>':"")+
    (L.length?(VIEW==="large"?'<div class="bigGrid">'+L.map(card).join("")+'</div>':'<div class="card" style="padding:4px 15px">'+L.map(card).join("")+'</div>'):'<div class="card"><div class="empty">'+(all.length?"No product matches your search.":EMPTY[TAB])+'</div></div>');
  bar();
}
function bar(){const n=SEL.size;$("bar").classList.toggle("on",CAN&&n>0);$("barTxt").textContent=n+" selected";$("barGo").textContent=ACT[TAB].bulk+" ("+n+")";$("barDel").style.display=OWNER?"inline-flex":"none";$("barDel").textContent="🗑 Delete ("+n+")";}
function apply(d){
  BUSY=false;SEL.clear();
  if(d&&d.counts)D=d;
  if(d&&d.ok===false)say(d.error||"Something went wrong.","bad");else if(d&&d.warning)say(d.warning,"warn");else if(d&&d.message)say(d.message,"ok");
  render();
}
// Stock → Sold: the customer must be attached first
function pickCustomer(n){
  return new Promise(res=>{
    let chosen=null,T=null,done=false;const fin=v=>{if(done)return;done=true;ONCLOSE=null;res(v);};
    open('<div class="hd"><b>🔴 Sold — attach the customer</b><button class="x" type="button">✕</button></div>'+
      '<div class="hint">Choose the customer who bought '+(n>1?"these "+n+" products":"this product")+'. The sale is attached to the product and written in the customer’s info.</div>'+
      '<input type="text" id="cq" placeholder="🔎 Customer name, ID or phone…" autocomplete="off"><div id="cl" style="margin-top:6px"></div>'+
      '<div class="btns"><button class="btn block" id="cGo" type="button" disabled>Choose a customer</button></div>');
    ONCLOSE=()=>fin(null);
    const list=async()=>{
      const box=$("cl");if(!box)return;
      const d=await api("/api/products/customers?q="+encodeURIComponent($("cq").value.trim()));
      if(!$("cl"))return;
      if(!d||!d.ok){$("cl").innerHTML='<div class="empty">'+esc((d&&d.error)||"Could not load the customers.")+'</div>';return;}
      $("cl").innerHTML=d.customers.length?d.customers.map(c=>'<div class="opt'+(chosen&&chosen.id===c.id?" on":"")+'" data-c="'+esc(c.id)+'"><div>'+esc(c.name||"—")+' <span class="pill">ID '+esc(c.id)+'</span><small>'+esc([c.phone,c.location,c.username&&("@"+String(c.username).replace(/^@/,""))].filter(Boolean).join(" · ")||"—")+'</small></div></div>').join(""):'<div class="empty">No customer found.</div>';
      $("cl").querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{chosen=d.customers.find(c=>c.id===el.dataset.c);$("cl").querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o===el));$("cGo").disabled=!chosen;$("cGo").textContent="🔴 Sold to "+(chosen.name||chosen.id);});
    };
    $("cq").addEventListener("input",()=>{clearTimeout(T);T=setTimeout(list,250);});
    $("cGo").onclick=()=>{if(!chosen)return;const c=chosen;ONCLOSE=null;close();fin(c);};
    list();
  });
}
async function advance(ids){
  if(BUSY||!ids.length)return;const a=ACT[TAB];let body={ids,from:TAB};
  if(TAB==="stock"){const c=await pickCustomer(ids.length);if(!c)return;body.customerId=c.id;}
  else if(!await confirmBox((ids.length>1?ids.length+" products: ":"")+a.ask,a.bulk))return;
  BUSY=true;apply(await api("/api/products/advance",body));
}
async function removeProducts(ids){
  if(BUSY||!ids.length||!OWNER)return;
  const one=list().find(p=>p.id===ids[0]);
  if(!await confirmBox(ids.length===1&&one?"Delete “"+name(one)+"” for good? Its Product ID is never reused.":"Delete these "+ids.length+" products for good?","🗑 Delete"))return;
  BUSY=true;apply(await api("/api/products/delete",{ids}));
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TAB=b.dataset.t;SEL.clear();try{localStorage.setItem("prTab",TAB);}catch{}render();});
document.querySelector(".vt").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;VIEW=b.dataset.view;try{localStorage.setItem("prView",VIEW);}catch{}render();});
$("q").addEventListener("input",render);
$("barGo").onclick=()=>advance([...SEL]);
$("barDel").onclick=()=>removeProducts([...SEL]);
$("out").addEventListener("change",e=>{const c=e.target;if(c.id==="selAll"){const L=filtered();c.checked?L.forEach(p=>SEL.add(p.id)):L.forEach(p=>SEL.delete(p.id));return render();}if(c.dataset&&c.dataset.sel){c.checked?SEL.add(c.dataset.sel):SEL.delete(c.dataset.sel);bar();}});
$("out").addEventListener("click",e=>{
  if(e.target.closest("input,label"))return;
  const x=e.target.closest("[data-del]");if(x){e.stopPropagation();return removeProducts([x.dataset.del]);}
  const a=e.target.closest("[data-adv]");if(a){e.stopPropagation();return advance([a.dataset.adv]);}
  const o=e.target.closest("[data-open]");if(o)detail(o.dataset.open);
});
function detail(id){
  const p=list().find(x=>x.id===id);if(!p)return;
  const r=(l,v)=>v?'<div><span>'+l+'</span><b>'+esc(v)+'</b></div>':"";
  open('<div class="hd"><b>'+esc(name(p))+'</b><button class="x" type="button">✕</button></div>'+(p.photo?img(p,"bigimg"):"")+'<div class="tg">'+kind(p)+stagePill(p)+'</div><div class="dl">'+
    r("Product ID",p.code)+r("Model",p.model)+r("Type",p.ptype)+r("Measurement",p.desc)+r("🧱 Material",p.material)+r("🎨 Color",p.color)+r("🔧 Handle",p.handle)+r("👟 Shoe capacity",p.capacity)+r("Category",p.category)+r("📍 Location",p.location)+r("Order",p.orderRef)+r("Priority",p.priority)+r("👤 Sales",p.salesName)+r("Delivery date",p.deliveryDate)+r("Started",p.added)+r("Sent to workshop",p.sent?p.sent.at+" · "+p.sent.by:"")+r("Finished",p.finished)+r("Sold",p.soldInfo?p.soldInfo.at+(p.soldInfo.info?" · "+p.soldInfo.info:""):"")+r("📝 Note",p.note)+'</div>'+
    (CAN?'<div class="btns"><button class="btn block" id="dAdv">'+ACT[TAB].label+'</button>'+(OWNER?'<button class="btn red block" id="dDel">🗑 Delete product</button>':"")+'</div>':""));
  if($("dAdv"))$("dAdv").onclick=()=>{close();advance([id]);};
  if($("dDel"))$("dDel").onclick=()=>{close();removeProducts([id]);};
}
async function refresh(){const d=await api("/api/products");if(d&&d.ok){D=d;render();}else if(!D)$("out").innerHTML='<div class="card"><div class="empty">'+esc((d&&d.error)||"Could not load.")+'</div></div>';}
(async()=>{try{const m=await (await fetch("/api/me")).json();if(m&&m.role){CAN=!m.viewer&&(m.role==="owner"||(m.perms||[]).some(k=>k==="workshop"||k==="reports"))||m.enforced===false&&!m.viewer;OWNER=!m.viewer&&(m.role==="owner"||m.role==="open"||m.enforced===false);}}catch{}refresh();})();
setInterval(()=>{if(document.visibilityState==="visible"&&!BUSY&&!$("ov").classList.contains("on"))refresh();},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!BUSY&&!$("ov").classList.contains("on"))refresh();});
</script>
</body>
