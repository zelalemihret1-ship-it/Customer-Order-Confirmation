<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ambar Furniture — Reports</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch{}
(function(){const f=window.fetch;window.fetch=function(u,o){o=o||{};if(typeof u==="string"&&u.startsWith("/api/")){const h=new Headers(o.headers||{});let id="";try{id=Telegram.WebApp.initData||"";}catch{}if(id)h.set("X-Telegram-Init-Data",id);let k="";try{k=localStorage.getItem("ownerKey")||"";}catch{}if(k)h.set("X-Setup-Key",k);o.headers=h;}return f.call(this,u,o);};})();
</script>
<link rel="stylesheet" href="/app.css?v=119">
<style>
:root{--ink:#0f2e25;--green:#1b4d3e;--gold:#b89552;--cream:#f4efe3;--bg:#f2efe8;--card:#fff;--line:#e6e0d2;--tx:#1f2a26;--mute:#6d675d;--ok:#1f8f55;--okbg:#e3f4e8;--warn:#8a5a00;--warnbg:#fff1d6;--bad:#b3261e;--badbg:#fde7e5;--blue:#14598f;--bluebg:#e4f0fb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans Ethiopic",Nyala,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(135deg,#0b2119,#1b4d3e);color:var(--cream);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;border-bottom:3px solid var(--gold);position:relative}
header .row1{display:flex;align-items:center;gap:10px}
header a.back{color:var(--cream);text-decoration:none;font-size:12px;font-weight:700;border:1px solid #ffffff44;border-radius:999px;padding:7px 12px;white-space:nowrap}
header h1{margin:0;font-size:20px;letter-spacing:.4px;flex:1;text-align:center}
header .sub{text-align:center;opacity:.75;margin-top:4px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase}
.cloud{border:1px solid #ffffff44;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;background:#ffffff14;color:var(--cream);cursor:pointer;white-space:nowrap}
.cloud.ok{background:#1f8f5533;border-color:#58d28f88}.cloud.bad{background:#b3261e44;border-color:#ff8a80aa}
main{max-width:1080px;margin:auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;gap:6px;background:#e7e2d6;border-radius:16px;padding:5px;margin-bottom:14px}
.seg button{flex:1;border:0;border-radius:12px;padding:12px 4px;font-weight:800;font-size:14px;background:transparent;color:var(--green);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-size:11px;font-weight:700;opacity:.7}
.seg button.on{background:var(--ink);color:#fff;box-shadow:0 4px 12px #0f2e2555}.seg button.on small{opacity:.8;color:#ffd877}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 11px;border-left:5px solid var(--green);box-shadow:0 3px 12px #0000000a}
.kpi .l{font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--mute);text-transform:uppercase}
.kpi .n{font-size:26px;font-weight:900;margin-top:3px;line-height:1.05}
.kpi .s{font-size:11px;color:var(--mute);margin-top:2px}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:150px;margin:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;font-size:15px;background:#fff;color:var(--tx);font-family:inherit}
.add{border:0;border-radius:14px;padding:12px 16px;font-weight:900;font-size:14px;color:#fff;background:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px #0f2e2540}
.sub2{display:flex;gap:6px;margin-bottom:12px}
.sub2 button{border:1.5px solid var(--line);background:#fff;color:var(--green);border-radius:999px;padding:8px 16px;font-weight:800;font-size:13px;cursor:pointer}
.sub2 button.on{background:var(--green);color:#fff;border-color:var(--green)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 4px 16px #0000000d;display:flex;flex-direction:column;gap:6px}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:900;font-size:13px;background:var(--cream);color:var(--ink);border:1px solid #d9cfb4;border-radius:8px;padding:3px 9px;letter-spacing:.5px}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.wip{background:var(--warnbg);color:var(--warn)}.pill.stock{background:var(--okbg);color:var(--ok)}.pill.sold{background:var(--bluebg);color:var(--blue)}.pill.low{background:var(--warnbg);color:var(--warn)}.pill.out{background:var(--badbg);color:var(--bad)}
.nm{font-size:16px;font-weight:800;line-height:1.3}
.nt{font-size:13px;color:var(--mute);line-height:1.4}
.meta{font-size:12px;color:var(--mute);line-height:1.5}
.meta b{color:var(--tx)}
.stamp{background:var(--bluebg);color:var(--blue);border-radius:12px;padding:8px 10px;font-size:12.5px;font-weight:700;line-height:1.5}
.bal{display:flex;align-items:baseline;gap:6px}.bal .n{font-size:30px;font-weight:900;line-height:1}.bal .u{font-size:13px;font-weight:700;color:var(--mute)}
.bar{height:6px;background:#eee8da;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}.bar i.low{background:#e0a21b}.bar i.out{background:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.b{border:1.5px solid var(--line);background:#fff;color:var(--green);border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.b.main{flex:1;border:0;color:#fff;background:var(--ok)}.b.gold{flex:1;border:0;color:#fff;background:#a5782a}.b.cut{flex:1;border:0;color:#fff;background:var(--bad)}.b.add2{flex:1;border:0;color:#fff;background:var(--green)}
.b.red{color:var(--bad)}
.b:disabled{opacity:.5}
.empty{grid-column:1/-1;text-align:center;padding:34px 12px;color:var(--mute);background:#fff;border:1.5px dashed #d9d2bf;border-radius:18px;line-height:1.6}
h3.sec{margin:20px 2px 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--green)}
.logrow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.logrow .q{font-weight:900;min-width:64px;text-align:right}.logrow .q.p{color:var(--ok)}.logrow .q.m{color:var(--bad)}
.logrow .w{flex:1;line-height:1.35}.logrow small{display:block;color:var(--mute);font-size:11.5px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fffffff0;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;z-index:50}
.foot button{flex:1;max-width:260px;border:0;border-radius:14px;padding:13px 8px;font-weight:900;font-size:14px;color:#fff;cursor:pointer}
.foot .zero{background:#7a1410}.foot .pdf{background:var(--bad)}.foot .bk{background:var(--ink)}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 4px 16px #0000000d}
.card h2{margin:0 0 10px;color:var(--ink);font-size:17px}
label{font-weight:800;font-size:12.5px;display:block;margin-top:11px;color:var(--green)}
label em{font-weight:600;font-style:normal;color:var(--mute)}
input,textarea{width:100%;padding:12px;border:1.5px solid #d9d3c4;border-radius:12px;margin-top:5px;font-size:16px;font-family:inherit;background:#fff;color:var(--tx);user-select:text;-webkit-user-select:text}
select{width:100%;padding:12px;border:1.5px solid #d9d3c4;border-radius:12px;margin-top:5px;font-size:16px;font-family:inherit;background:#fff;color:var(--tx)}
.gh{grid-column:1/-1;margin:8px 2px 0;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--green);display:flex;justify-content:space-between;border-bottom:2px solid var(--gold);padding-bottom:5px}
.pill.hi{background:var(--badbg);color:var(--bad)}.pill.med{background:var(--warnbg);color:var(--warn)}.pill.low2{background:#eceff1;color:#546e7a}.pill.cus{background:#f8dfe6;color:#8a2c4a}.pill.rdy{background:var(--bluebg);color:var(--blue)}.pill.today{background:#cfe2f3;color:#0b5394}
.facts{font-size:12.5px;color:var(--mute);line-height:1.55}.facts b{color:var(--tx)}
textarea{min-height:70px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:15px;color:#fff;background:var(--ink);margin-top:12px;cursor:pointer;text-align:center;text-decoration:none}
.btn.grey{background:#fff;color:var(--green);border:1.5px solid var(--line)}.btn.red{background:var(--bad)}.btn.blue{background:#229ed9}.btn.ok{background:var(--ok)}.btn.gold{background:#a5782a}.btn.cut{background:var(--bad)}
.btn:disabled{opacity:.55}
.hint{color:var(--mute);font-size:12.5px;line-height:1.55}
.msg{border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;margin:10px 0 0;white-space:pre-wrap;display:none}
.msg.ok{display:block;background:var(--okbg);border:1px solid #9bd3ad;color:#176b3a}.msg.bad{display:block;background:var(--badbg);border:1px solid #efb1ac;color:#9a1d15}.msg.info{display:block;background:var(--warnbg);border:1px solid #e9c46a;color:#7a5600}
.ov{position:fixed;inset:0;background:#0009;z-index:200;display:none;align-items:flex-end;justify-content:center}
.ov .box{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ov.on{display:flex}
.ov h2{margin:0 0 4px;color:var(--ink);font-size:18px}
.chip{display:inline-block;background:var(--ink);color:#ffd877;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800}
.hrow{padding:9px 2px;border-bottom:1px solid #eee;font-size:13px;line-height:1.45}.hrow small{color:var(--mute);display:block}
ol{padding-left:20px;line-height:1.7;font-size:14px;margin:8px 0}
.busy{position:fixed;inset:0;background:#fffc;z-index:300;display:none;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:16px}
.busy.on{display:flex}
@media(max-width:520px){.kpi .n{font-size:22px}.list{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="row1"><a class="back" href="/home.html">‹ Home</a><h1>Reports</h1><button class="cloud" id="cloud" type="button">☁ Backup</button></div>
  <div class="sub">Workflow · Stock · Material</div>
</header>
<main>
  <div id="gate" class="card" style="display:none"><h2>🔒 No access</h2><p id="gateMsg">Reports are only for admins the main admin gave this section.</p></div>
  <div id="view" style="display:none">
    <div class="seg" id="seg"></div>
    <div class="kpis" id="kpis"></div>
    <div class="tools"><input id="q" type="search" placeholder="🔍 Search…" autocomplete="off"><button class="add" id="addBtn" type="button"></button></div>
    <div class="sub2" id="sub2" style="display:none"></div>
    <div id="vMsg" class="msg"></div>
    <div id="out" class="list"></div>
    <div id="extra"></div>
  </div>
</main>
<div class="foot" id="foot" style="display:none"><button class="pdf" id="bPdf" type="button">📄 Make PDF</button><button class="bk" id="bBk" type="button">☁ Google Sheet backup</button><button class="zero" id="bZero" type="button" style="display:none">🗑 Start from 0</button></div>

<!-- form sheet (add / edit / sell / add-cut) -->
<div class="ov" id="fOv"><div class="box"><h2 id="fTitle"></h2><div class="hint" id="fInfo"></div><div id="fBody"></div><div id="fMsg" class="msg"></div><button class="btn" id="fOk" type="button">Save</button><button class="btn grey" id="fNo" type="button">Cancel</button></div></div>
<!-- history -->
<div class="ov" id="hOv"><div class="box"><h2 id="hTitle"></h2><div id="hBody"></div><button class="btn grey" id="hNo" type="button">Close</button></div></div>
<!-- PDF -->
<div class="ov" id="pdfOv"><div class="box">
  <h2>📄 PDF is ready</h2><div class="hint" id="pdfInfo"></div>
  <a class="btn" id="pdfDl" href="#" download>⬇ Download PDF</a>
  <button class="btn blue" id="pdfTg" type="button">✈ Send to my Telegram</button>
  <button class="btn grey" id="pdfOpen" type="button">Open PDF</button>
  <div id="pdfMsg" class="msg"></div>
  <button class="btn grey" id="pdfClose" type="button">Close</button>
</div></div>
<!-- backup sheet -->
<div class="ov" id="bkOv"><div class="box" id="bkBox"></div></div>
<div class="busy" id="busy"><span id="busyTx">Please wait…</span></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MN=["Meskerem","Tikimt","Hidar","Tahsas","Tir","Yekatit","Megabit","Miazia","Ginbot","Sene","Hamle","Nehase","Pagume"];
const fmtD=d=>{const m=/^(\d{4})\/(\d{2})\/(\d{2})$/.exec(d||"");return m?(+m[3])+" "+(MN[+m[2]-1]||m[2])+" "+m[1]:(d||"");};
// Ethiopian clock: the day starts at sunrise. 13:15 → 7:15 ቀን · 21:00 → 3:00 ሌሊት · 06:00 → 12:00 ቀን
const et=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||"");if(!m)return t||"";const h=+m[1];return (((h+6)%12)||12)+":"+m[2]+" "+(h>=6&&h<18?"ቀን":"ሌሊት");};
const fmtDT=o=>o&&o.d?fmtD(o.d)+" · "+et(o.t):"—";
const dmy=d=>{const m=/^(\d{4})\/(\d{2})\/(\d{2})$/.exec(d||"");return m?m[3]+"/"+m[2]+"/"+m[1].slice(2):(d||"");};
const lab=p=>[p.model,p.desc].filter(Boolean).join(" ")||p.code;
const matLab=m=>m.name+(m.type?" "+m.type:"");
const logMat=l=>l.material+(l.mtype?" "+l.mtype:"");
const isCus=p=>p.orderType==="CUSTOM";
const nf=v=>(v===""||v==null)?"":Number(v).toLocaleString("en-US",{maximumFractionDigits:3});
let S={products:[],materials:[],log:[],backup:{},now:{d:"",t:""},nextCode:"P-0001",cats:["SHOE SHELF","OTHERS","GADGETS"]},tab="wf",sub="stock",q="";
try{const s=localStorage.getItem("repTab2");if(["wf","st","mt"].includes(s))tab=s;}catch{}
const toast=m=>{try{(window.AppToast||alert)(m);}catch{alert(m);}};
const say=(id,t,kind)=>{const e=$(id);e.className="msg "+(kind||"info");e.textContent=t;e.style.display=t?"block":"none";if(!t)e.className="msg";};
const busy=t=>{$("busyTx").textContent=t||"Please wait…";$("busy").classList.toggle("on",!!t);};
async function api(path,body){
  const o=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
  let d;try{const r=await fetch(path,o);try{d=await r.json();}catch{d={ok:false,error:"Server answered with an error ("+r.status+")."};}if(r.status===401||r.status===403)d.ok=false;}catch(e){d={ok:false,error:"No connection to the server."};}
  if(d&&d.ok&&d.products){S={...S,...d};}
  return d;
}

// ── start ──
let IS_OWNER=false;
(async()=>{
  let me;try{me=await (await fetch("/api/me")).json();}catch{me={};}
  IS_OWNER=me.role==="owner";
  if(!(IS_OWNER||(me.perms||[]).includes("reports"))){
    $("gate").style.display="block";
    $("gateMsg").textContent=me.role==="admin"?"The main admin has not given you the Reports section. Ask them to turn it on in Manage Admins.":(me.error||"Access denied.");
    return;
  }
  $("view").style.display="block";$("foot").style.display="flex";$("bZero").style.display=IS_OWNER?"block":"none";
  const d=await api("/api/reports/state");
  if(!d.ok){say("vMsg",d.error||"Could not open the reports.","bad");}
  render();
})();
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&$("view").style.display!=="none"&&!document.querySelector(".ov.on")){const d=await api("/api/reports/state");if(d.ok)render();}});

// ── screens ──
const by=s=>S.products.filter(p=>p.status===s);
const lowOf=m=>m.qty<=0?"out":(m.min>0&&m.qty<=m.min?"low":"ok");
function render(){
  const wf=by("workflow"),st=by("stock"),sd=by("sold");
  $("seg").innerHTML=[["wf","🛠 Workflow",wf.length+" in progress"],["st","📦 Stock",st.length+" in stock"],["mt","🧱 Material",S.materials.length+" kinds"]].map(t=>'<button type="button" data-t="'+t[0]+'" class="'+(t[0]===tab?"on":"")+'">'+t[1]+'<small>'+t[2]+'</small></button>').join("");
  const low=S.materials.filter(m=>lowOf(m)!=="ok").length,today=S.log.filter(l=>l.d===S.now.d).length,soldToday=sd.filter(p=>p.sold&&p.sold.d===S.now.d).length;
  const K=(l,n,s,c)=>'<div class="kpi" style="border-left-color:'+(c||"var(--green)")+'"><div class="l">'+l+'</div><div class="n">'+n+'</div><div class="s">'+s+'</div></div>';
  $("kpis").innerHTML=tab==="wf"?K("In workflow",wf.length,"products in progress","#d9a21b")+K("In stock",st.length,"finished","#1f8f55")+K("All products",S.products.length,"including sold","#14598f")
    :tab==="st"?K("In stock",st.length,"ready to sell","#1f8f55")+K("Sold",sd.length,"products sold","#14598f")+K("Sold today",soldToday,fmtD(S.now.d),"#b3261e")
    :K("Materials",S.materials.length,"kinds in store","#8a5a00")+K("Low / out",low,low?"to re-order":"all good",low?"#b3261e":"#1f8f55")+K("Moves today",today,fmtD(S.now.d),"#6d675d");
  $("addBtn").textContent=tab==="mt"?"➕ New material":"➕ New product";
  $("addBtn").style.display=tab==="st"?"none":"block";
  $("q").placeholder=tab==="mt"?"🔍 Search material…":"🔍 Search Prod Id, model, description…";
  $("sub2").style.display=tab==="st"?"flex":"none";
  if(tab==="st")$("sub2").innerHTML='<button type="button" data-s="stock" class="'+(sub==="stock"?"on":"")+'">📦 In stock ('+st.length+')</button><button type="button" data-s="sold" class="'+(sub==="sold"?"on":"")+'">💰 Sold ('+sd.length+')</button>';
  const hit=t=>!q||String(t).toLowerCase().includes(q);
  const text=p=>[p.code,p.model,p.desc,p.note,p.sno,p.salesName,p.location,p.category,p.changes].join(" ");
  const facts=p=>{const f=[];if(p.sno)f.push("S.No <b>"+esc(p.sno)+"</b>");if(p.salesName)f.push("Sales <b>"+esc(p.salesName)+"</b>");if(p.location)f.push("📍 "+esc(p.location));if(p.deliveryDate)f.push("Delivery <b>"+esc(fmtD(p.deliveryDate))+"</b>");if(p.changes)f.push("Changes: "+esc(p.changes));return f.length?'<div class="facts">'+f.join(" · ")+'</div>':"";};
  const prPill=p=>p.priority==="HIGH"?'<span class="pill hi">HIGH</span>':p.priority==="MEDIUM"?'<span class="pill med">MEDIUM</span>':'<span class="pill low2">LOW</span>';
  const tyPill=p=>isCus(p)?'<span class="pill cus">CUSTOM</span>':'<span class="pill rdy">READYMADE</span>';
  const head=p=>'<div class="top"><span class="code">'+esc(p.code)+'</span><span style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">'+tyPill(p)+(tab==="wf"?prPill(p):"")+'</span></div><div class="nm">'+esc(lab(p))+'</div>'+(p.category&&tab!=="wf"?'<div class="meta">'+esc(p.category)+'</div>':"")+(p.note?'<div class="nt">Correction: '+esc(p.note)+'</div>':"")+facts(p);
  const group=(L,card)=>{const cats=[...S.cats];L.forEach(p=>{const c=p.category||"OTHERS";if(!cats.includes(c))cats.push(c);});return cats.map(c=>{const g=L.filter(p=>(p.category||"OTHERS")===c);return g.length?'<div class="gh"><span>'+esc(c)+'</span><span>'+g.length+'</span></div>'+g.map(card).join(""):"";}).join("");};
  let h="",extra="";
  if(tab==="wf"){
    const L=wf.filter(p=>hit(text(p)));
    h=L.map(p=>'<div class="item">'+head(p)+'<div class="meta">Started <b>'+esc(fmtDT(p.added))+'</b>'+(p.added&&p.added.by?' · '+esc(p.added.by):'')+'</div>'

const cell=(v,o={})=>[String(v==null?"":v),o.bg||"",o.fg||"",o.b?1:0,o.sz||10,o.al||"",0];
function grid(name,heads,widths,rows,opt={}){
  const out=[heads.map(h=>cell(h,{bg:"#1b4d3e",fg:"#ffffff",b:1,sz:10,al:opt.al&&opt.al[heads.indexOf(h)]||"left"}))];
  rows.forEach((r,i)=>out.push(r.map((v,c)=>{const o=(opt.fmt&&opt.fmt(v,c,r))||{};return cell(v,{bg:o.bg||(i%2?"#f7f4ec":"#ffffff"),fg:o.fg,b:o.b||(opt.bold&&opt.bold.includes(c)),sz:10,al:(opt.al&&opt.al[c])||""});})));
  if(opt.total)out.push(opt.total.map((v,c)=>cell(v,{bg:"#efe6cf",b:1,sz:10,al:(opt.al&&opt.al[c])||""})));
  if(!rows.length)out.push([cell(opt.empty||"Nothing here yet.",{fg:"#6d675d",sz:10}),...widths.slice(1).map(()=>cell(""))]);
  return {name,rows:out,colW:widths,rowH:out.map((_,i)=>i===0?32:28),merges:[]};
}

function mergeMaps(t){
  const origin=new Map(),covered=new Set();
  for(const [r,c,rs,cs] of t.merges||[]){origin.set(r+","+c,[rs,cs]);for(let i=0;i<rs;i++)for(let j=0;j<cs;j++)if(i||j)covered.add((r+i)+","+(c+j));}
  return {origin,covered};
}
function alignOf(cell){const a=cell[5];if(a==="left"||a==="center"||a==="right")return a;return /^[-+]?[\d.,:\/% ]+$/.test(cell[0]||"")&&cell[0]!==""?"right":"left";}
const PW=2339,PH=1654,MX=60,TOP=150,BOT=70; // A4 landscape at 200 dpi
function planPages(t){
  const total=t.colW.reduce((a,b)=>a+b,0)||1,scale=Math.min((PW-2*MX)/total,2.4);
  const rowsH=t.rowH.map(h=>Math.max(14,h||21)*scale),avail=PH-TOP-BOT-40;
  const pages=[];let cur=[],y=0;
  rowsH.forEach((h,i)=>{if(cur.length&&y+h>avail){pages.push(cur);cur=[];y=0;}cur.push(i);y+=h;});
  if(cur.length)pages.push(cur);
  if(!pages.length)pages.push([]);
  return {scale,pages,rowsH,total};
}
function fitText(ctx,txt,maxW,px,bold){
  const fam='Arial,"Noto Sans Ethiopic",Nyala,"Abyssinica SIL",sans-serif';
  let s=px;
  for(let i=0;i<8;i++){ctx.font=(bold?"700 ":"400 ")+s+"px "+fam;if(ctx.measureText(txt).width<=maxW||s<=px*.62)break;s*=.92;}
  if(ctx.measureText(txt).width>maxW){let a=txt;while(a.length>1&&ctx.measureText(a+"…").width>maxW)a=a.slice(0,-1);return a+"…";}
  return txt;
}
function drawPage(ctx,title,tabName,t,plan,rowsIdx,pageNo,pageTotal,sheetName,stamp){
  ctx.fillStyle="#fff";ctx.fillRect(0,0,PW,PH);
  ctx.fillStyle="#0f2e25";ctx.fillRect(0,0,PW,92);ctx.fillStyle="#b89552";ctx.fillRect(0,92,PW,8);
  ctx.textBaseline="middle";ctx.fillStyle="#f4efe3";ctx.font='700 40px Arial,sans-serif';ctx.textAlign="left";ctx.fillText("AMBAR FURNITURE",MX,46);
  ctx.font='400 28px Arial,sans-serif';ctx.textAlign="right";ctx.fillText(stamp,PW-MX,46);
  ctx.fillStyle="#0f2e25";ctx.textAlign="left";ctx.font='800 44px Arial,sans-serif';ctx.fillText(title+(tabName&&tabName!==title?"  ·  "+tabName:""),MX,TOP-26);
  const {origin,covered}=mergeMaps(t),sc=plan.scale;
  const xs=[0];t.colW.forEach(w=>xs.push(xs[xs.length-1]+w*sc));
  const onPage=new Set(rowsIdx);let y=TOP+10;
  const ys=new Map();rowsIdx.forEach(r=>{ys.set(r,y);y+=plan.rowsH[r];});
  const endY=y;
  ctx.lineWidth=1;
  for(const r of rowsIdx){
    const row=t.rows[r],y0=ys.get(r),h=plan.rowsH[r];
    for(let c=0;c<row.length;c++){
      let cell=row[c],x0=MX+xs[c],w=t.colW[c]*sc,hh=h,drawText=true;
      const key=r+","+c;
      if(covered.has(key)){
        // part of a merged block: find its origin; the origin draws it, unless the origin is on another page
        let o=null;for(const [k,v] of origin){const [or,oc]=k.split(",").map(Number);if(or<=r&&r<or+v[0]&&oc<=c&&c<oc+v[1]){o={or,oc,v};break;}}
        if(o&&onPage.has(o.or))continue;
        if(o){cell=t.rows[o.or][o.oc];drawText=false;}
      }
      const m=origin.get(key);
      if(m){ // merged origin: width over its columns, height over its rows that are on this page
        w=0;for(let j=0;j<m[1];j++)w+=(t.colW[c+j]||0)*sc;
        hh=0;for(let i=0;i<m[0];i++)if(onPage.has(r+i))hh+=plan.rowsH[r+i];
      }
      if(cell[1]){ctx.fillStyle=cell[1];ctx.fillRect(x0,y0,w,hh);}
      ctx.strokeStyle="#bdbdbd";ctx.strokeRect(x0+.5,y0+.5,w,hh);
      const v=String(cell[0]==null?"":cell[0]);
      if(drawText&&v){
        const px=Math.max(12,(cell[4]||10)*(96/72)*sc*.95),pad=8*Math.min(sc,1.6)+2;
        const txt=fitText(ctx,v.replace(/\s*\n\s*/g," "),w-2*pad,Math.min(px,hh*.78),!!cell[3]);

async function jpegBytes(cv){const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",.92));return new Uint8Array(await b.arrayBuffer());}
function buildPdf(imgs){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=x=>{const u=typeof x==="string"?enc.encode(x):x;chunks.push(u);len+=u.length;};
  const obj=(id,fn)=>{offs[id]=len;push(id+" 0 obj\n");fn();push("\nendobj\n");};
  const n=imgs.length;
  push("%PDF-1.4\n%âãÏÓ\n");
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push("<< /Type /Pages /Kids ["+imgs.map((_,i)=>(3+i*3)+" 0 R").join(" ")+"] /Count "+n+" >>"));
  imgs.forEach((im,i)=>{
    const p=3+i*3,c=p+1,x=p+2,cs="q 842 0 0 595 0 0 cm /Im0 Do Q";
    obj(p,()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /XObject << /Im0 "+x+" 0 R >> >> /Contents "+c+" 0 R >>"));
    obj(c,()=>push("<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"));
    obj(x,()=>{push("<< /Type /XObject /Subtype /Image /Width "+im.w+" /Height "+im.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+im.u8.length+" >>\nstream\n");push(im.u8);push("\nendstream");});
  });
  const total=3+n*3,xref=len;
  push("xref\n0 "+total+"\n0000000000 65535 f \n");
  for(let id=1;id<total;id++)push(String(offs[id]).padStart(10,"0")+" 00000 n \n");
  push("trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  return new Blob(chunks,{type:"application/pdf"});
}
async function buildPages(g,stampTxt){
  const pages=[],cv=document.createElement("canvas");cv.width=PW;cv.height=PH;const ctx=cv.getContext("2d");
  const plans=g.tabs.map(t=>planPages(t)),total=plans.reduce((a,p)=>a+p.pages.length,0);let no=0;
  for(let ti=0;ti<g.tabs.length;ti++){
    const t=g.tabs[ti],plan=plans[ti];
    for(const rows of plan.pages){
      no++;busy("Making the PDF… page "+no+" / "+total);
      drawPage(ctx,g.title,t.name,t,plan,rows,no,total,"Ambar Furniture",stampTxt);
      const u8=await jpegBytes(cv);pages.push({u8,w:PW,h:PH});
      await new Promise(r=>setTimeout(r,0));
    }
  }
  return pages;
}
