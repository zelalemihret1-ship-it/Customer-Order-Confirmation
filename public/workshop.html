<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f3d30">
<title>Ambar Furniture — Workshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch{}
(function(){const f=window.fetch;window.fetch=function(u,o){o=o||{};if(typeof u==="string"&&u.startsWith("/api/")){const h=new Headers(o.headers||{});let id="";try{id=Telegram.WebApp.initData||"";}catch{}if(id)h.set("X-Telegram-Init-Data",id);let k="";try{k=localStorage.getItem("ownerKey")||"";}catch{}if(k)h.set("X-Setup-Key",k);o.headers=h;}return f.call(this,u,o);};})();
</script>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#14231e;--muted:#6b7680;--line:#e8ebf0;--brand:#0f3d30;--brand2:#17604b;--gold:#e0b22e;--ok:#17824c;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fde8e6;--warn:#8a5a00;--warnbg:#fff1d4;--blue:#14598f;--bluebg:#e5f1fb;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px rgba(16,24,40,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0a2a20,var(--brand) 55%,var(--brand2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;box-shadow:0 6px 24px rgba(8,30,22,.25)}
header .in{max-width:820px;margin:auto;display:flex;align-items:center;gap:12px}
header a.back{color:#fff;text-decoration:none;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 13px;white-space:nowrap}
header h1{margin:0;font-size:18px;line-height:1.15}header .sub{font-size:11.5px;opacity:.7;margin-top:2px}
main{max-width:820px;margin:auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:15.5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:2px 0 8px}
.msg{display:none;border-radius:13px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:12px;line-height:1.5;border:1px solid transparent}
.msg.ok{display:block;background:var(--okbg);color:var(--ok);border-color:#bfe6cf}.msg.bad{display:block;background:var(--badbg);color:var(--bad);border-color:#f4c4c0}.msg.warn{display:block;background:var(--warnbg);color:var(--warn);border-color:#ecd49a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 15px;font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-family:inherit}
.btn.sec{background:#edf0f4;color:var(--brand)}.btn.gold{background:linear-gradient(135deg,#f0cd6a,var(--gold));color:#2f2100}.btn.red{background:var(--badbg);color:var(--bad)}.btn.sm{padding:8px 11px;font-size:12.5px;border-radius:10px}.btn.block{width:100%}.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid #e1e5eb;border-radius:12px;padding:11px 12px;font-size:15px;background:#fbfcfd;color:var(--ink);font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(23,96,75,.12)}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:12.5px;font-weight:700;margin:10px 0 4px}
.seg{display:flex;gap:6px;margin-bottom:14px}.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 4px;font-weight:700;font-size:13px;color:var(--brand);cursor:pointer;font-family:inherit}.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;background:#eef0f3;color:#56606a}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.wait{background:var(--warnbg);color:var(--warn)}.pill.blue{background:var(--bluebg);color:var(--blue)}
.vt{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}.vt button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}.vt button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bigGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.bigc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;position:relative}.bigc .ph{width:100%;aspect-ratio:1;object-fit:cover;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:44px}.bigc img.ph{display:block}.bigc .bd{padding:9px 10px 10px}.bigc .t{font-weight:800;font-size:14px}.bigc .m{font-size:12px;color:var(--muted);margin:3px 0 8px;line-height:1.4}.bigc .chk{position:absolute;top:8px;left:8px;width:22px;height:22px}.bigc .btns{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.it{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.it:last-child{border-bottom:0}
.it .th{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#eef0f3;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.it .mid{flex:1;min-width:0}.it .t{font-weight:800;font-size:14.5px;word-break:break-word}.it .m{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.it .rt{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.empty{text-align:center;color:var(--muted);padding:26px 8px;font-size:13.5px;line-height:1.6}
.pill.wait2{background:var(--warnbg);color:var(--warn)}
.grp{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.grp b{font-size:15px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.sheet .hd b{font-size:17px}.sheet .x{border:0;background:#eef0f3;border-radius:50%;width:34px;height:34px;font-size:17px;font-weight:800;cursor:pointer}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:13px;margin-top:8px;cursor:pointer;font-weight:700;font-size:14px}.opt.on{border-color:var(--brand2);background:#eef8f3}.opt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pv{display:flex;gap:12px;align-items:center}.pv img,.pv .ph0{width:84px;height:84px;border-radius:14px;object-fit:cover;background:#eef0f3;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.chk{width:22px;height:22px;flex:none;accent-color:var(--brand2)}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:8px;align-items:center;justify-content:space-between;z-index:20;box-shadow:0 -8px 24px rgba(16,24,40,.08)}.bar.on{display:flex}
#gate{display:none;position:fixed;inset:0;z-index:99;background:#0b1511;color:#fff;align-items:center;justify-content:center;padding:24px;text-align:center}
.hint:not(.keep){display:none!important}header .sub{display:none!important}
.dl div span{display:block;font-size:11px;color:var(--muted);font-weight:700}.dl div b{font-size:13.5px;word-break:break-word}.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
</style>
</head>
<body>
<div id="gate"><div><h2>AMBAR Furniture</h2><p id="gateMsg">Checking your access…</p><a class="btn" href="/home.html" style="text-decoration:none">← Home</a></div></div>
<header><div class="in"><a class="back" href="/home.html">← Home</a><div style="flex:1;min-width:0"><h1>🛠 Workshop</h1><div class="sub">Save models · order them to the workshop · track what was sent</div></div></div></header>
<main>
  <div class="msg" id="msg"></div>

  <div class="card" style="padding:10px 15px">
    <button type="button" id="grTog" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;font-weight:800;font-size:14px;padding:4px 0"><span>📨 Telegram groups <span id="grSum" style="font-weight:500;color:var(--muted);font-size:12px"></span></span><span id="grArrow" style="color:var(--muted)">▾</span></button>
    <div id="grBody" style="display:none;margin-top:10px">
  <div class="card" style="box-shadow:none;margin-bottom:10px">
    <h2>📨 Workshop group</h2>
    <div class="grp"><div><b id="gName">—</b><div class="hint" id="gHint" style="margin:2px 0 0"></div></div><div class="btns" style="margin:0"><button class="btn sm" id="gPick">Choose group</button><button class="btn sm sec" id="gTest">Send test</button></div></div>
  </div>
  <div class="card" style="box-shadow:none;margin-bottom:10px">
    <h2>🎨 Finishing group</h2>
    <div class="grp"><div><b id="fgName">—</b><div class="hint" id="fgHint" style="margin:2px 0 0"></div></div><div class="btns" style="margin:0"><button class="btn sm" id="fgPick">Choose group</button><button class="btn sm sec" id="fgTest">Send test</button></div></div>
  </div>
  <div class="card" style="box-shadow:none;margin-bottom:0" id="sgCard">
    <h2>🔴 Sold Out group</h2>
    <div class="grp"><div><b id="sgName">—</b><div class="hint" id="sgHint" style="margin:2px 0 0"></div></div><div class="btns" style="margin:0"><button class="btn sm" id="sgPick">Choose group</button><button class="btn sm sec" id="sgTest">Send test</button></div></div>
  </div>
    </div>
  </div>

  <div class="seg" id="seg"><button data-t="standard" class="on">📦 Standard</button><button data-t="custom">🎨 Custom</button><button data-t="orders">📋 Orders ↗</button><button data-t="sent">📤 Sent</button></div>
  <div id="out"></div>
</main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S=null,TAB="ready",SEL=new Set(),Q="",BUSY=false;
try{const t=localStorage.getItem("wsTab");if(["ready","sent"].includes(t))TAB=t;}catch{}
let VIEW="list";try{if(localStorage.getItem("wsView")==="large")VIEW="large";}catch{}
let RTAB="standard";try{const t=localStorage.getItem("wsRTab");if(["standard","custom"].includes(t))RTAB=t;}catch{}

async function api(path,body){
  try{const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    let d={};try{d=await r.json();}catch{}
    if(r.status===401||r.status===403){gate(d.error||"No access.");}
    return d;}catch(e){return{ok:false,error:"Could not reach the server. Try again."};}
}
function gate(t){$("gate").style.display="flex";$("gateMsg").textContent=t;}
function say(text,kind){const m=$("msg");m.className="msg "+(kind||"ok");m.textContent=text;m.scrollIntoView({block:"nearest"});if(kind!=="bad"&&kind!=="warn")setTimeout(()=>{if(m.textContent===text)m.className="msg";},6000);}
function take(d,okMsg){ // apply a server answer (it carries a fresh state)
  if(d&&d.orders)S=d;
  if(d&&d.ok===false)say(d.error||"Something went wrong.","bad");
  else{if(d&&d.warning)say(d.warning,"warn");else if(d&&(d.message||okMsg))say(d.message||okMsg,"ok");}
  render();
}
function confirmBox(text,okLabel){return new Promise(res=>{open('<div class="hd"><b>Please confirm</b></div><p style="font-size:14.5px;line-height:1.6;white-space:pre-wrap">'+esc(text)+'</p><div class="btns"><button class="btn" id="cOk">'+esc(okLabel||"Yes, send")+'</button><button class="btn sec" id="cNo">Cancel</button></div>');$("cOk").onclick=()=>{close();res(true);};$("cNo").onclick=()=>{close();res(false);};});}
function open(h){$("sheet").innerHTML=h;$("ov").classList.add("on");}
function close(){$("ov").classList.remove("on");}
$("ov").addEventListener("click",e=>{if(e.target===$("ov")||e.target.closest(".x"))close();});

async function refresh(){const d=await api("/api/workshop/state");if(d&&d.ok){S=d;render();}else if(!S)$("out").innerHTML='<div class="empty">'+esc((d&&d.error)||"Could not load.")+'</div>';}
const when=v=>{const t=Date.parse(v||"");return Number.isFinite(t)?new Date(t).toLocaleDateString(undefined,{day:"2-digit",month:"short"})+" "+new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";};
const thumb=u=>u?'<img class="th" loading="lazy" src="'+esc(u)+'" alt="" onerror="this.outerHTML=\'<div class=th>🛋</div>\'">':'<div class="th">🛋</div>';
const pthumb=p=>p.photo?thumb("/api/reports-photo/"+p.photo+".jpg"):'<div class="th">🛋</div>';

function render(){
  if(!S)return;
  $("gName").textContent=S.group?S.groupName:"No group chosen yet";
  $("gHint").textContent=S.group?"Ordered products are posted here by the AMBAR bot (it must be an admin of the group) with a “Finished product” button.":"Choose the Telegram group (and topic) of the workshop first.";
  $("gTest").style.display=S.group?"":"none";
  $("fgName").textContent=S.finGroup?S.finGroupName:"No finishing group chosen yet";
  $("fgHint").textContent=S.finGroup?"When the workshop man presses “Finished product”, the product is posted here with a “Finished” button.":"Choose the Telegram group (and topic) of the finishing team.";
  $("fgTest").style.display=S.finGroup?"":"none";
  $("sgName").textContent=S.soldGroup?S.soldGroupName:"No Sold Out group chosen yet";
  $("sgHint").textContent=S.soldGroup?"Products sold from stock (Customer ID → Move → Readymade, Products → Sold) are posted here with the customer info.":"Choose the Telegram group (and topic) that receives the sold products.";
  $("sgTest").style.display=S.soldGroup?"":"none";
  const CAN=S.can||{};$("sgCard").style.display=CAN.sold===false?"none":"";$("grTog").closest(".card").style.display=CAN.groups===false?"none":""; // v191: the main admin can switch the group choice off for an admin
  $("grSum").textContent="· Workshop "+(S.group?"✓":"✗")+" · Finishing "+(S.finGroup?"✓":"✗")+(CAN.sold===false?"":" · Sold Out "+(S.soldGroup?"✓":"✗"));
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",TAB==="ready"?b.dataset.t===RTAB:b.dataset.t===TAB));
    if(TAB==="orders")drawOrders();else if(TAB==="ready")drawReady();else drawSent();
}
$("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const t=b.dataset.t;
  if(t==="orders"){location.href="/callers.html"+location.hash;return;} // orders are sent from the customer data (Customer ID → Move)
  if(t==="standard"||t==="custom"){TAB="ready";RTAB=t;try{localStorage.setItem("wsRTab",RTAB);}catch{}}else TAB=t;
  SEL.clear();Q="";try{localStorage.setItem("wsTab",TAB);}catch{}render();});

// ── ORDER PRODUCTS ──────────────────────────────────────────────────────────
const orderRow=(o,again)=>'<div class="it">'+thumb(o.photo)+'<div class="mid"><div class="t">'+esc(o.product||"Order")+'</div><div class="m">'+esc(o.orderId)+' · 👤 '+esc(o.customerName||"—")+(o.customerId?' ('+esc(o.customerId)+')':'')+'<br>'+esc(when(o.createdAt))+' <span class="pill '+(o.status==="Confirmed"?"ok":"wait")+'">'+esc(o.status||"Pending")+'</span> '+(o.sent?'<span class="pill blue">Sent '+esc(o.sent.at||"")+'</span>':'')+'</div></div><div class="rt">'+(o.confirmed?'<button class="btn sm '+(again?"sec":"")+'" data-send="'+esc(o.id)+'">'+(again?"Send again":"🛠 Send")+'</button>':'<span class="pill wait2">⏳ Waiting customer confirmation</span>')+'</div></div>';
// v177: only the NEWEST orders that are not sent yet (newest first). Sent orders are in the "Sent products" tab; rejected orders cannot be sent.
const newOrders=()=>S.orders.filter(o=>!o.sent&&o.status!=="Rejected").slice().sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
function drawOrders(){
  const q=Q.toLowerCase(),all=newOrders(),L=all.filter(o=>!q||[o.orderId,o.product,o.customerName,o.customerId].join(" ").toLowerCase().includes(q)),done=S.orders.filter(o=>o.sent).length;
  $("out").innerHTML='<div class="card"><h2>📋 Order products <span class="pill wait">'+all.length+' new</span></h2><div class="hint">The newest orders that are <b>not sent yet</b>, newest first. A product that is <b>not in stock</b> is sent to the workshop only <b>after the customer confirms</b> the order (⏳ until then). Tap <b>Send</b> to post the product photo, measurement, details <b>and the customer info</b> to the workshop group. Sent orders move to <b>Sent products</b>'+(done?' ('+done+')':'')+'.</div><input type="text" id="q" placeholder="Search order, product or customer…" value="'+esc(Q)+'" autocomplete="off">'+
   (L.length?L.map((o,i)=>(i===0&&!q?'<div style="margin:10px 0 -4px"><span class="pill ok">🆕 Newest order</span></div>':'')+orderRow(o,false)).join(""):'<div class="empty">'+(all.length?"No order matches your search.":(done?"<b>All orders are sent.</b><br>Look in <b>Sent products</b> to see them.":"<b>No orders yet.</b><br>Orders you create in <b>Customer Order Confirmation</b> appear here."))+'</div>')+'</div>';
  const qi=$("q");qi.addEventListener("input",()=>{Q=qi.value;const p=qi.selectionStart;drawOrders();const n=$("q");n.focus();try{n.setSelectionRange(p,p);}catch{}});
}
async function sendOrder(id,again){
  const o=S.orders.find(x=>String(x.id)===String(id));if(!o||BUSY)return;
  if(!S.group){say("First choose the workshop group.","bad");return;}
  if(!await confirmBox((again?"Send AGAIN? ":"")+"Send “"+(o.product||"order")+"” ("+o.orderId+") with the info of "+(o.customerName||"the customer")+" to\n"+S.groupName+"?"))return;
  BUSY=true;const d=await api("/api/workshop/send-order",{id:o.id,again:!!again});BUSY=false;take(d);
}

// ── READYMADE PRODUCTS ──────────────────────────────────────────────────────
const sizesTxt=p=>(p.sizes&&p.sizes.length?p.sizes:(p.size?[p.size]:[])).join(" / ");
const cMeta=p=>[p.ptype,sizesTxt(p)&&("📏 "+sizesTxt(p)),p.material&&("🧱 "+p.material),p.color&&("🎨 "+p.color),p.handle&&("🔧 "+p.handle),p.capacity&&("👟 "+p.capacity),p.note].filter(Boolean).join(" · ")||"—";
const cardBtns=(p,custom)=>'<button class="btn sm" data-order="'+esc(p.id)+'">🛠 Order</button><button class="btn sm sec" data-cedit="'+esc(p.id)+'">✏️</button>'+(custom?'<button class="btn sm sec" data-tostd="'+esc(p.id)+'">⬆️ Standard</button>':'')+'<button class="btn sm red" data-cdel="'+esc(p.id)+'">🗑</button>';
const bigCard=(p,custom)=>'<div class="bigc" data-open="'+esc(p.id)+'" style="cursor:pointer">'+(p.photo?'<img class="ph" loading="lazy" src="/api/reports-photo/'+esc(p.photo)+'.jpg" alt="" onerror="this.outerHTML=\'<div class=ph>🛋</div>\'">':'<div class="ph">🛋</div>')+'<div class="bd"><div class="t">'+esc(p.model)+'</div><div class="m">'+esc(cMeta(p))+'</div><div class="btns">'+cardBtns(p,custom)+'</div></div></div>';
const prodRow=(p,custom)=>'<div class="it" data-open="'+esc(p.id)+'" style="cursor:pointer">'+(p.photo?thumb("/api/reports-photo/"+p.photo+".jpg"):'<div class="th">🛋</div>')+'<div class="mid"><div class="t">'+esc(p.model)+'</div><div class="m">'+esc(cMeta(p))+'</div></div><div class="rt">'+cardBtns(p,custom)+'</div></div>';
const pMeta=p=>[p.ptype,p.desc,p.material&&("🧱 "+p.material),p.color&&("🎨 "+p.color),p.handle&&("🔧 "+p.handle),p.capacity&&("👟 "+p.capacity),p.note].filter(Boolean).join(" · ")||"—";
const stState=p=>p.status==="stock"?'<span class="pill ok">📦 In stock</span>':p.status==="sold"?'<span class="pill bad">🔴 Sold</span>':p.stage==="finishing"?'<span class="pill blue">🎨 In finishing</span>':'<span class="pill wait">🛠 In workshop</span>';
function drawReady(){
  const custom=RTAB==="custom",q=Q.toLowerCase(),base=(S.catalog||[]).filter(p=>(p.kind==="custom")===custom),L=base.filter(p=>!q||[p.model,p.ptype,p.size,p.handle,p.color,p.material,p.capacity].join(" ").toLowerCase().includes(q));

function orderSheet(id){
  const c=(S.catalog||[]).find(x=>x.id===id);if(!c)return;
  if(!S.group){say("First choose the workshop group.","bad");return;}
  if(!S.finGroup){say("First choose the finishing group (📨 Telegram groups).","bad");return;}
  const sz=(c.sizes&&c.sizes.length)?c.sizes:(c.size?[c.size]:[]);
  open('<div class="hd"><b>🛠 Order to the workshop</b><button class="x" type="button">✕</button></div><div class="msg" id="fMsg"></div>'+
   '<div class="pv">'+(c.photo?'<img src="/api/reports-photo/'+esc(c.photo)+'.jpg" alt="">':'<div class="ph0">🛋</div>')+'<div><b>'+esc(c.model)+'</b><div class="hint keep" style="margin:3px 0 0">'+esc(cMeta(c))+'</div></div></div>'+
   '<label>Measurements — choose what to send (quantity for each)</label><div id="oRows"></div>'+
   '<div class="btns" style="margin-top:6px"><button class="btn sm sec" id="oAddRow" type="button">➕ Another measurement</button></div>'+
   '<div class="hint keep" id="oIds" style="margin:8px 0 0"></div>'+
   '<label>Note <em style="font-weight:500;color:var(--muted)">(optional)</em></label><textarea id="oNote"></textarea>'+
   '<div class="btns"><button class="btn block" id="oGo" type="button">📤 Send to workshop</button></div>');
  const rows=$("oRows");
  const addRow=(size,qty,ro)=>{const d=document.createElement("div");d.style.cssText="display:flex;gap:8px;margin-top:6px;align-items:center";d.innerHTML='<input type="text" class="oS" value="'+esc(size||"")+'" placeholder="120*35*120" autocomplete="off" style="flex:1"'+(ro?' readonly':'')+'><input type="number" class="oQ" value="'+(qty||0)+'" min="0" max="20" inputmode="numeric" style="width:78px" title="Quantity">'+(ro?'':'<button type="button" class="btn sm red oX">✕</button>');rows.appendChild(d);const x=d.querySelector(".oX");if(x)x.onclick=()=>{d.remove();idsPrev();};d.querySelector(".oQ").addEventListener("input",idsPrev);};
  const total=()=>[...rows.querySelectorAll(".oQ")].reduce((n,i)=>n+Math.max(0,Math.min(parseInt(i.value,10)||0,20)),0);
  const idsPrev=async()=>{const n=total();if(!n){$("oIds").innerHTML="";return;}const d=await api("/api/workshop/peek?n="+n+"&ptype="+encodeURIComponent(c.ptype||""));if(d&&d.ok&&$("oIds"))$("oIds").innerHTML="🆔 Product IDs prepared: <b>"+esc((d.codes||[]).join(", "))+"</b>";};
  if(sz.length)sz.forEach((x,i)=>addRow(x,i===0?1:0,true));else addRow("",1,false);
  $("oAddRow").onclick=()=>addRow("",0,false);
  idsPrev();
  $("oGo").onclick=async()=>{
    const items=[...rows.children].map(r=>({size:r.querySelector(".oS").value.trim(),qty:parseInt(r.querySelector(".oQ").value,10)||0})).filter(x=>x.qty>0);
    if(!items.length){fm("Type a quantity for at least one measurement.","bad");return;}
    if(items.some(x=>!x.size)){fm("Type the measurement.","bad");return;}
    $("oGo").disabled=true;$("oGo").textContent="Sending…";
    const d=await api("/api/workshop/catalog/order",{id,items,note:$("oNote").value});
    if(d&&d.ok!==false){close();take(d);}else{$("oGo").disabled=false;$("oGo").textContent="📤 Send to workshop";fm((d&&d.error)||"Could not send.","bad");}
  };
}

$("out").addEventListener("click",async e=>{
  const t=e.target.closest("button");
  if(!t){const o=e.target.closest("[data-open]");if(o&&!e.target.closest("input,select,textarea,a,label"))detailSheet(o.dataset.open);return;}
  const d=t.dataset;
  if(d.cedit){const c=(S.catalog||[]).find(x=>x.id===d.cedit);if(c)itemForm(c.kind==="custom",c);return;}
  if(d.send)return sendOrder(d.send,!!(S.orders.find(o=>String(o.id)===d.send)||{}).sent);
  if(d.view){VIEW=d.view;try{localStorage.setItem("wsView",VIEW);}catch{}return render();}
  if(d.tostd){if(await confirmBox("Move this custom model to Standard?","⬆️ Move"))take(await api("/api/workshop/to-standard",{id:d.tostd}));return;}
  if(d.reset){if(await confirmBox("Hide everything sent before now? (Nothing is deleted.)","Start from now"))take(await api("/api/workshop/sent/reset",{}));return;}
  if(d.order)return orderSheet(d.order);
  if(d.cdel){if(await confirmBox("Delete this saved model from the catalog? Products already ordered stay.","Delete"))take(await api("/api/workshop/catalog/delete",{id:d.cdel}));return;}
  if(d.r){RTAB=d.r;SEL.clear();Q="";try{localStorage.setItem("wsRTab",RTAB);}catch{}return render();}
  if(t.id==="addP")return itemForm(RTAB==="custom",null);
});

// photo → small JPEG data URL
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.width,h=im.height,m=1280;if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);URL.revokeObjectURL(u);let q=.85,out=c.toDataURL("image/jpeg",q);while(out.length>1.1e6&&q>.4){q-=.1;out=c.toDataURL("image/jpeg",q);}res(out);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("This photo format is not supported. Choose a JPG or PNG photo."));};im.src=u;});}

function chooseField(id,label,opts,ph,cur){const has=cur&&opts.includes(cur),oth=cur&&!has;return '<label>'+label+'</label><select id="'+id+'S"><option value="">— Choose —</option>'+opts.map(o=>'<option'+(has&&o===cur?' selected':'')+'>'+esc(o)+'</option>').join("")+'<option value="__other"'+(oth?' selected':'')+'>✍️ Other (type it)</option></select><input type="text" id="'+id+'" value="'+(oth?esc(cur):"")+'" style="'+(oth?"":"display:none;")+'margin-top:6px" placeholder="'+esc(ph)+'" autocomplete="off">';}
function wireChoice(id){const sel=$(id+"S");if(sel)sel.onchange=()=>{const o=sel.value==="__other";$(id).style.display=o?"block":"none";if(o)$(id).focus();};}
function choiceVal(id){const sel=$(id+"S");if(!sel)return"";return sel.value==="__other"?$(id).value.trim():sel.value;}
function drawPhotos(){
  const h=KEEP.map((id,i)=>'<div style="position:relative"><img src="/api/reports-photo/'+esc(id)+'.jpg" style="width:72px;height:72px;border-radius:12px;object-fit:cover" alt=""><button type="button" data-pk="'+i+'" style="position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:22px;height:22px;background:#b3261e;color:#fff;font-weight:800">✕</button></div>').join("")+

  $("pvBox").innerHTML=h||'<div class="ph0">📷</div>';$("pvCount").textContent=(KEEP.length+NEWP.length)?(KEEP.length+NEWP.length)+" photo"+((KEEP.length+NEWP.length)===1?"":"s"):"No photo yet";
  $("pvBox").querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{KEEP.splice(+b.dataset.pk,1);drawPhotos();});

}

  };

   '<div class="btns"><button class="btn block" id="gSave" '+(PICK?"":"disabled")+'>💾 Save '+GKN[GK][1]+' group</button>'+(curOf(GK)?'<button class="btn sm red" id="gClear">Remove</button>':'')+'</div>'+
   '<p class="hint">The group must contain your Telegram account (or the AMBAR bot as admin) so it can post.</p>';
  $("gList").onclick=async()=>{$("gList").disabled=true;$("gList").textContent="Loading…";const d=await api("/api/workshop/dialogs",{});$("gList").disabled=false;$("gList").textContent="📂 Choose from my groups";
    if(!d.ok){fm(d.error,"bad");return;}
    $("gExtra").innerHTML=d.groups.length?d.groups.map(g=>'<div class="opt" data-g="'+esc(g.chat)+'" data-t="'+esc(g.title)+'" data-f="'+(g.forum?1:0)+'">'+(g.forum?"🗂":"👥")+'<span>'+esc(g.title)+(g.forum?"<small>has topics</small>":"")+'</span></div>').join(""):'<div class="empty">No groups found.</div>';};
  $("gCheck").onclick=async()=>{const v=$("gLink").value.trim();if(!v)return;const d=await api("/api/workshop/resolve",{link:v});if(!d.ok){fm(d.error,"bad");return;}
    PICK={chat:d.chat,title:d.title||"",topic:d.topic||0,topicTitle:d.topicTitle||""};
    if(d.forum&&!d.topic&&d.topics&&d.topics.length)return gDraw(topicsHtml(d.topics));gDraw();};
  $("gSave").onclick=async()=>{const d=await api("/api/workshop/settings",{group:PICK,kind:GK});if(d&&d.ok!==false){close();take(d);}else fm((d&&d.error)||"Could not save.","bad");};
  if($("gClear"))$("gClear").onclick=async()=>{close();take(await api("/api/workshop/settings/clear",{kind:GK}));};
}
const topicsHtml=T=>'<div class="hint" style="margin-top:10px">Choose the topic:</div>'+T.filter(t=>!t.closed).map(t=>'<div class="opt" data-tp="'+t.id+'" data-tt="'+esc(t.title)+'">🧵 <span>'+esc(t.title)+'</span></div>').join("");
$("sheet").addEventListener("click",async e=>{
  const g=e.target.closest("[data-g]"),tp=e.target.closest("[data-tp]");
  if(g){PICK={chat:g.dataset.g,title:g.dataset.t,topic:0,topicTitle:""};
    if(g.dataset.f==="1"){const d=await api("/api/workshop/topics",{chat:g.dataset.g});if(d.ok&&d.forum){gDraw(topicsHtml(d.topics));return;}if(!d.ok)fm(d.error,"bad");}
    gDraw();}
  if(tp){PICK.topic=Number(tp.dataset.tp)>1?Number(tp.dataset.tp):0;PICK.topicTitle=tp.dataset.tt;gDraw();}
});
$("gTest").onclick=async()=>{$("gTest").disabled=true;const d=await api("/api/workshop/test",{kind:"work"});$("gTest").disabled=false;say(d.ok?d.message:d.error,d.ok?"ok":"bad");};
$("fgTest").onclick=async()=>{$("fgTest").disabled=true;const d=await api("/api/workshop/test",{kind:"finish"});$("fgTest").disabled=false;say(d.ok?d.message:d.error,d.ok?"ok":"bad");};
$("sgTest").onclick=async()=>{$("sgTest").disabled=true;const d=await api("/api/workshop/test",{kind:"sold"});$("sgTest").disabled=false;say(d.ok?d.message:d.error,d.ok?"ok":"bad");};

document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!$("ov").classList.contains("on")&&!BUSY)refresh();});
refresh();
</script>
</body>
</html>
