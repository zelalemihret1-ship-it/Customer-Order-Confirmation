<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f3d30">
<title>Ambar Furniture — Workshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch{}
(function(){const f=window.fetch;window.fetch=function(u,o){o=o||{};if(typeof u==="string"&&u.startsWith("/api/")){const h=new Headers(o.headers||{});let id="";try{id=Telegram.WebApp.initData||"";}catch{}if(id)h.set("X-Telegram-Init-Data",id);let k="";try{k=localStorage.getItem("ownerKey")||"";}catch{}if(k)h.set("X-Setup-Key",k);o.headers=h;}return f.call(this,u,o);};})();
</script>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#14231e;--muted:#6b7680;--line:#e8ebf0;--brand:#0f3d30;--brand2:#17604b;--gold:#e0b22e;--ok:#17824c;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fde8e6;--warn:#8a5a00;--warnbg:#fff1d4;--blue:#14598f;--bluebg:#e5f1fb;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px rgba(16,24,40,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0a2a20,var(--brand) 55%,var(--brand2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;box-shadow:0 6px 24px rgba(8,30,22,.25)}
header .in{max-width:820px;margin:auto;display:flex;align-items:center;gap:12px}
header a.back{color:#fff;text-decoration:none;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 13px;white-space:nowrap}
header h1{margin:0;font-size:18px;line-height:1.15}header .sub{font-size:11.5px;opacity:.7;margin-top:2px}
main{max-width:820px;margin:auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:15.5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:2px 0 8px}
.msg{display:none;border-radius:13px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:12px;line-height:1.5;border:1px solid transparent}
.msg.ok{display:block;background:var(--okbg);color:var(--ok);border-color:#bfe6cf}.msg.bad{display:block;background:var(--badbg);color:var(--bad);border-color:#f4c4c0}.msg.warn{display:block;background:var(--warnbg);color:var(--warn);border-color:#ecd49a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 15px;font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-family:inherit}
.btn.sec{background:#edf0f4;color:var(--brand)}.btn.gold{background:linear-gradient(135deg,#f0cd6a,var(--gold));color:#2f2100}.btn.red{background:var(--badbg);color:var(--bad)}.btn.sm{padding:8px 11px;font-size:12.5px;border-radius:10px}.btn.block{width:100%}.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid #e1e5eb;border-radius:12px;padding:11px 12px;font-size:15px;background:#fbfcfd;color:var(--ink);font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(23,96,75,.12)}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:12.5px;font-weight:700;margin:10px 0 4px}
.seg{display:flex;gap:6px;margin-bottom:14px}.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 4px;font-weight:700;font-size:13px;color:var(--brand);cursor:pointer;font-family:inherit}.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;background:#eef0f3;color:#56606a}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.wait{background:var(--warnbg);color:var(--warn)}.pill.blue{background:var(--bluebg);color:var(--blue)}
.it{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.it:last-child{border-bottom:0}
.it .th{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#eef0f3;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.it .mid{flex:1;min-width:0}.it .t{font-weight:800;font-size:14.5px;word-break:break-word}.it .m{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.it .rt{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.empty{text-align:center;color:var(--muted);padding:26px 8px;font-size:13.5px;line-height:1.6}
.grp{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.grp b{font-size:15px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.sheet .hd b{font-size:17px}.sheet .x{border:0;background:#eef0f3;border-radius:50%;width:34px;height:34px;font-size:17px;font-weight:800;cursor:pointer}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:13px;margin-top:8px;cursor:pointer;font-weight:700;font-size:14px}.opt.on{border-color:var(--brand2);background:#eef8f3}.opt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pv{display:flex;gap:12px;align-items:center}.pv img,.pv .ph0{width:84px;height:84px;border-radius:14px;object-fit:cover;background:#eef0f3;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.chk{width:22px;height:22px;flex:none;accent-color:var(--brand2)}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:8px;align-items:center;justify-content:space-between;z-index:20;box-shadow:0 -8px 24px rgba(16,24,40,.08)}.bar.on{display:flex}
#gate{display:none;position:fixed;inset:0;z-index:99;background:#0b1511;color:#fff;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="gate"><div><h2>AMBAR Furniture</h2><p id="gateMsg">Checking your access…</p><a class="btn" href="/home.html" style="text-decoration:none">← Home</a></div></div>
<header><div class="in"><a class="back" href="/home.html">← Home</a><div style="flex:1;min-width:0"><h1>🛠 Workshop</h1><div class="sub">Send order & readymade products to the workshop group</div></div></div></header>
<main>
  <div class="msg" id="msg"></div>

  <div class="card">
    <h2>📨 Workshop group</h2>
    <div class="grp"><div><b id="gName">—</b><div class="hint" id="gHint" style="margin:2px 0 0"></div></div><div class="btns" style="margin:0"><button class="btn sm" id="gPick">Choose group</button><button class="btn sm sec" id="gTest">Send test</button></div></div>
  </div>

  <div class="seg" id="seg"><button data-t="orders" class="on">📋 Order products</button><button data-t="ready">🛋 Readymade</button><button data-t="sent">🕘 Sent</button></div>
  <div id="out"></div>
</main>
<div class="bar" id="bar"><b id="barTxt"></b><button class="btn" id="barGo">📤 Send selected</button></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S=null,TAB="orders",SEL=new Set(),Q="",BUSY=false;
try{const t=localStorage.getItem("wsTab");if(["orders","ready","sent"].includes(t))TAB=t;}catch{}

async function api(path,body){
  try{const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    let d={};try{d=await r.json();}catch{}
    if(r.status===401||r.status===403){gate(d.error||"No access.");}
    return d;}catch(e){return{ok:false,error:"Could not reach the server. Try again."};}
}
function gate(t){$("gate").style.display="flex";$("gateMsg").textContent=t;}
function say(text,kind){const m=$("msg");m.className="msg "+(kind||"ok");m.textContent=text;m.scrollIntoView({block:"nearest"});if(kind!=="bad"&&kind!=="warn")setTimeout(()=>{if(m.textContent===text)m.className="msg";},6000);}
function take(d,okMsg){ // apply a server answer (it carries a fresh state)
  if(d&&d.orders)S=d;
  if(d&&d.ok===false)say(d.error||"Something went wrong.","bad");
  else{if(d&&d.warning)say(d.warning,"warn");else if(d&&(d.message||okMsg))say(d.message||okMsg,"ok");}
  render();
}
function confirmBox(text,okLabel){return new Promise(res=>{open('<div class="hd"><b>Please confirm</b></div><p style="font-size:14.5px;line-height:1.6;white-space:pre-wrap">'+esc(text)+'</p><div class="btns"><button class="btn" id="cOk">'+esc(okLabel||"Yes, send")+'</button><button class="btn sec" id="cNo">Cancel</button></div>');$("cOk").onclick=()=>{close();res(true);};$("cNo").onclick=()=>{close();res(false);};});}
function open(h){$("sheet").innerHTML=h;$("ov").classList.add("on");}
function close(){$("ov").classList.remove("on");}
$("ov").addEventListener("click",e=>{if(e.target===$("ov")||e.target.closest(".x"))close();});

async function refresh(){const d=await api("/api/workshop/state");if(d&&d.ok){S=d;render();}else if(!S)$("out").innerHTML='<div class="empty">'+esc((d&&d.error)||"Could not load.")+'</div>';}
const when=v=>{const t=Date.parse(v||"");return Number.isFinite(t)?new Date(t).toLocaleDateString(undefined,{day:"2-digit",month:"short"})+" "+new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";};
const thumb=u=>u?'<img class="th" loading="lazy" src="'+esc(u)+'" alt="" onerror="this.outerHTML=\'<div class=th>🛋</div>\'">':'<div class="th">🛋</div>';
const pthumb=p=>p.photo?thumb("/api/reports-photo/"+p.photo+".jpg"):'<div class="th">🛋</div>';

function render(){
  if(!S)return;
  $("gName").textContent=S.group?S.groupName:"No group chosen yet";
  $("gHint").textContent=S.group?("Posted by "+(S.sender.ready?"your Telegram account":"the AMBAR bot")+(S.sender.ready?"":" (connect your Telegram account on Home to post as yourself)")):"Choose the Telegram group (and topic) of the workshop first.";
  $("gTest").style.display=S.group?"":"none";
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===TAB));
  $("bar").classList.remove("on");
  if(TAB==="orders")drawOrders();else if(TAB==="ready")drawReady();else drawSent();
}
$("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TAB=b.dataset.t;SEL.clear();Q="";try{localStorage.setItem("wsTab",TAB);}catch{}render();});

// ── ORDER PRODUCTS ──────────────────────────────────────────────────────────
function drawOrders(){
  const q=Q.toLowerCase(),L=S.orders.filter(o=>!q||[o.orderId,o.product,o.customerName,o.customerId].join(" ").toLowerCase().includes(q));
  $("out").innerHTML='<div class="card"><h2>📋 Order products</h2><div class="hint">Every order you made, with its customer. Tap <b>Send</b> to post the product photo, measurement, details <b>and the customer info</b> to the workshop group.</div><input type="text" id="q" placeholder="Search order, product or customer…" value="'+esc(Q)+'" autocomplete="off">'+
   (L.length?L.map(o=>'<div class="it">'+thumb(o.photo)+'<div class="mid"><div class="t">'+esc(o.product||"Order")+'</div><div class="m">'+esc(o.orderId)+' · 👤 '+esc(o.customerName||"—")+(o.customerId?' ('+esc(o.customerId)+')':'')+'<br>'+esc(when(o.createdAt))+' <span class="pill '+(o.status==="Confirmed"?"ok":o.status==="Rejected"?"bad":"wait")+'">'+esc(o.status||"Pending")+'</span> '+(o.sent?'<span class="pill blue">Sent '+esc(o.sent.at||"")+'</span>':'')+'</div></div><div class="rt"><button class="btn sm '+(o.sent?"sec":"")+'" data-send="'+esc(o.id)+'" '+(o.status==="Rejected"?"disabled":"")+'>'+(o.sent?"Send again":"🛠 Send")+'</button></div></div>').join(""):'<div class="empty">'+(S.orders.length?"No order matches your search.":"<b>No orders yet.</b><br>Orders you create in <b>Customer Order Confirmation</b> appear here.")+'</div>')+'</div>';
  const qi=$("q");qi.addEventListener("input",()=>{Q=qi.value;const p=qi.selectionStart;drawOrders();const n=$("q");n.focus();try{n.setSelectionRange(p,p);}catch{}});
}
async function sendOrder(id,again){
  const o=S.orders.find(x=>String(x.id)===String(id));if(!o||BUSY)return;
  if(!S.group){say("First choose the workshop group.","bad");return;}
  if(!await confirmBox((again?"Send AGAIN? ":"")+"Send “"+(o.product||"order")+"” ("+o.orderId+") with the info of "+(o.customerName||"the customer")+" to\n"+S.groupName+"?"))return;
  BUSY=true;const d=await api("/api/workshop/send-order",{id:o.id,again:!!again});BUSY=false;take(d);
}

// ── READYMADE PRODUCTS ──────────────────────────────────────────────────────
function custSelect(id){return '<select id="'+id+'"><option value="">— no customer —</option>'+S.customers.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.id+" · "+c.name+(c.phone?" · "+c.phone:""))+'</option>').join("")+'</select>';}
function drawReady(){
  const q=Q.toLowerCase(),L=S.stock.filter(p=>!q||[p.code,p.model,p.ptype,p.desc,p.handle].join(" ").toLowerCase().includes(q));
  $("out").innerHTML='<div class="card"><h2>🛋 Readymade products</h2><div class="hint">Add a new readymade product (it goes into <b>Stock</b> and shows on Home → Stock view) or send products that are already in stock to the workshop group.</div>'+
   '<div class="btns" style="margin-top:4px"><button class="btn gold" id="addP">➕ New readymade product</button></div>'+
   '<label>👤 Customer info for the message <em style="font-weight:500;color:var(--muted)">(optional)</em></label>'+custSelect("rc")+
   '<label>🔎 Search stock</label><input type="text" id="q" placeholder="Code, model, type…" value="'+esc(Q)+'" autocomplete="off"></div>'+
   '<div class="card"><h2>📦 In stock <span class="pill ok">'+S.stock.length+'</span></h2>'+
   (L.length?L.map(p=>'<div class="it"><input class="chk" type="checkbox" data-sel="'+esc(p.id)+'" '+(SEL.has(p.id)?"checked":"")+'>'+pthumb(p)+'<div class="mid"><div class="t">'+esc(p.code+(p.model?"-"+p.model:""))+'</div><div class="m">'+esc([p.ptype,p.desc,p.handle&&("🔧 "+p.handle)].filter(Boolean).join(" · ")||"—")+'</div></div><div class="rt"><button class="btn sm" data-one="'+esc(p.id)+'">📤 Send</button><button class="btn sm sec" data-sold="'+esc(p.id)+'">Sold out</button>'+(S.me.owner?'<button class="btn sm red" data-del="'+esc(p.id)+'">🗑</button>':'')+'</div></div>').join(""):'<div class="empty">'+(S.stock.length?"No product matches your search.":"<b>Nothing in stock yet.</b><br>Press <b>➕ New readymade product</b> to add one.")+'</div>')+'</div>'+
   (S.workflow.length?'<div class="card"><h2>⏳ Not in stock yet <span class="pill wait">'+S.workflow.length+'</span></h2><div class="hint">Older products still in Workflow. Move them to Stock when they are ready.</div>'+S.workflow.map(p=>'<div class="it">'+pthumb(p)+'<div class="mid"><div class="t">'+esc(p.code+(p.model?"-"+p.model:""))+'</div><div class="m">'+esc([p.ptype,p.desc].filter(Boolean).join(" · "))+'</div></div><div class="rt"><button class="btn sm" data-fin="'+esc(p.id)+'">→ Stock</button></div></div>').join("")+'</div>':"");
  const qi=$("q");qi.addEventListener("input",()=>{Q=qi.value;const p=qi.selectionStart,c=$("rc").value;drawReady();$("rc").value=c;const n=$("q");n.focus();try{n.setSelectionRange(p,p);}catch{}});
  bar();
}
function bar(){const n=SEL.size;$("bar").classList.toggle("on",TAB==="ready"&&n>0);$("barTxt").textContent=n+" selected";}
async function sendProducts(ids){
  if(BUSY||!ids.length)return;if(!S.group){say("First choose the workshop group.","bad");return;}
  const cid=$("rc")?$("rc").value:"",c=S.customers.find(x=>x.id===cid);
  if(!await confirmBox("Send "+ids.length+" product"+(ids.length===1?"":"s")+(c?" with the info of "+c.name+" ("+c.id+")":"")+" to\n"+S.groupName+"?"))return;
  BUSY=true;const d=await api("/api/workshop/send-product",{ids,customerId:cid});BUSY=false;SEL.clear();take(d);
}
$("barGo").onclick=()=>sendProducts([...SEL]);
$("out").addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.send)return sendOrder(d.send,!!(S.orders.find(o=>String(o.id)===d.send)||{}).sent);
  if(d.one)return sendProducts([d.one]);
  if(d.sold){if(await confirmBox("Mark this product Sold Out? It leaves the stock.","Yes, sold out"))take(await api("/api/workshop/product/sold",{id:d.sold}));return;}
  if(d.del){if(await confirmBox("Delete this product for good?","Delete"))take(await api("/api/workshop/product/delete",{id:d.del}));return;}
  if(d.fin){take(await api("/api/workshop/product/finish",{id:d.fin}));return;}
  if(t.id==="addP")return addForm();
});
$("out").addEventListener("change",e=>{const c=e.target.closest("[data-sel]");if(!c)return;c.checked?SEL.add(c.dataset.sel):SEL.delete(c.dataset.sel);bar();});

// photo → small JPEG data URL
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.width,h=im.height,m=1280;if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);URL.revokeObjectURL(u);let q=.85,out=c.toDataURL("image/jpeg",q);while(out.length>1.9e6&&q>.4){q-=.1;out=c.toDataURL("image/jpeg",q);}res(out);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("This photo format is not supported. Choose a JPG or PNG photo."));};im.src=u;});}
let PHOTO="";
function addForm(){
  PHOTO="";
  open('<div class="hd"><b>➕ New readymade product</b><button class="x" type="button">✕</button></div><div class="msg" id="fMsg"></div>'+
   '<div class="pv"><div class="ph0" id="pvBox">📷</div><div><button class="btn sm sec" id="pvPick" type="button">📷 Choose photo</button><input type="file" id="pvFile" accept="image/*" style="display:none"></div></div>'+
   '<label>Model / name *</label><input type="text" id="fModel" placeholder="e.g. LUNA" autocomplete="off">'+
   '<label>Product type</label><input type="text" id="fType" list="ptl" placeholder="Shoe Shelf, Console Table…" autocomplete="off"><datalist id="ptl">'+S.ptypes.map(x=>'<option value="'+esc(x)+'">').join("")+'</datalist>'+
   '<label>Measurement</label><input type="text" id="fSize" placeholder="120*35*120" autocomplete="off">'+
   '<label>Quantity</label><input type="number" id="fQty" value="1" min="1" max="20" inputmode="numeric">'+
   '<label>Handle <em style="font-weight:500;color:var(--muted)">(optional)</em></label><input type="text" id="fHandle" autocomplete="off">'+
   '<label>Note <em style="font-weight:500;color:var(--muted)">(optional)</em></label><textarea id="fNote"></textarea>'+
   '<label>👤 Customer info for the message <em style="font-weight:500;color:var(--muted)">(optional)</em></label>'+custSelect("fCust")+
   '<label class="opt on" style="margin-top:12px"><input class="chk" type="checkbox" id="fSend" checked><span>Send to the workshop group now<small>'+esc(S.group?S.groupName:"Choose the group first")+'</small></span></label>'+
   '<div class="btns"><button class="btn block" id="fGo" type="button">Save product</button></div>');
  $("pvPick").onclick=()=>$("pvFile").click();
  $("pvFile").onchange=async()=>{const f=$("pvFile").files[0];if(!f)return;try{PHOTO=await shrink(f);$("pvBox").innerHTML='<img src="'+PHOTO+'" style="width:84px;height:84px;border-radius:14px;object-fit:cover" alt="">';}catch(e){fm(e.message,"bad");}};
  $("fGo").onclick=async()=>{
    const model=$("fModel").value.trim();if(!model){fm("Type the product model / name.","bad");return;}
    const send=$("fSend").checked;if(send&&!S.group){fm("Choose the workshop group first, or untick “Send to the workshop group”.","bad");return;}
    $("fGo").disabled=true;$("fGo").textContent="Saving…";
    const d=await api("/api/workshop/add-product",{model,ptype:$("fType").value,size:$("fSize").value,qty:$("fQty").value,handle:$("fHandle").value,note:$("fNote").value,customerId:$("fCust").value,photo:PHOTO,send});
    if(d&&d.ok){close();take(d);}else{$("fGo").disabled=false;$("fGo").textContent="Save product";fm((d&&d.error)||"Could not save.","bad");}
  };
}
function fm(t,k){const m=$("fMsg");if(m){m.className="msg "+k;m.textContent=t;}}

// ── SENT LOG ────────────────────────────────────────────────────────────────
function drawSent(){
  $("out").innerHTML='<div class="card"><h2>🕘 Sent to the workshop</h2>'+(S.sent.length?S.sent.map(x=>'<div class="it"><div class="th">'+(x.ok?(x.kind==="order"?"🛠":"📦"):"⚠️")+'</div><div class="mid"><div class="t">'+esc(x.title||"—")+' <span class="pill '+(x.ok?"ok":"bad")+'">'+(x.ok?"Sent":"Failed")+'</span></div><div class="m">'+esc(x.ref)+(x.customer?" · 👤 "+esc(x.customer):"")+'<br>'+esc(x.at)+" · "+esc(x.by)+(x.error?'<br><span style="color:var(--bad)">'+esc(x.error)+'</span>':'')+'</div></div></div>').join(""):'<div class="empty">Nothing sent yet.</div>')+'</div>';
}

// ── GROUP PICKER ────────────────────────────────────────────────────────────
let PICK=null;
$("gPick").onclick=()=>groupSheet();
function groupSheet(){
  PICK=S.group?{...S.group}:null;
  open('<div class="hd"><b>📨 Workshop group</b><button class="x" type="button">✕</button></div><div class="msg" id="fMsg"></div><div id="gBody"></div>');
  gDraw();
}
function gDraw(extra){
  $("gBody").innerHTML='<div class="hint">Current choice: <b>'+esc(PICK?((PICK.title||PICK.chat)+(PICK.topic?" › "+(PICK.topicTitle||"topic "+PICK.topic):"")):"none")+'</b></div>'+
   '<div class="btns"><button class="btn sm" id="gList">📂 Choose from my groups</button></div>'+
   '<label>…or paste a group / topic link, @username or id</label><input type="text" id="gLink" placeholder="https://t.me/c/123456789/2" autocomplete="off"><div class="btns"><button class="btn sm sec" id="gCheck">Check link</button></div>'+
   '<div id="gExtra">'+(extra||"")+'</div>'+
   '<div class="btns"><button class="btn block" id="gSave" '+(PICK?"":"disabled")+'>💾 Save workshop group</button>'+(S.group?'<button class="btn sm red" id="gClear">Remove</button>':'')+'</div>'+
   '<p class="hint">The group must contain your Telegram account (or the AMBAR bot as admin) so it can post.</p>';
  $("gList").onclick=async()=>{$("gList").disabled=true;$("gList").textContent="Loading…";const d=await api("/api/workshop/dialogs",{});$("gList").disabled=false;$("gList").textContent="📂 Choose from my groups";
    if(!d.ok){fm(d.error,"bad");return;}
    $("gExtra").innerHTML=d.groups.length?d.groups.map(g=>'<div class="opt" data-g="'+esc(g.chat)+'" data-t="'+esc(g.title)+'" data-f="'+(g.forum?1:0)+'">'+(g.forum?"🗂":"👥")+'<span>'+esc(g.title)+(g.forum?"<small>has topics</small>":"")+'</span></div>').join(""):'<div class="empty">No groups found.</div>';};
  $("gCheck").onclick=async()=>{const v=$("gLink").value.trim();if(!v)return;const d=await api("/api/workshop/resolve",{link:v});if(!d.ok){fm(d.error,"bad");return;}
    PICK={chat:d.chat,title:d.title||"",topic:d.topic||0,topicTitle:d.topicTitle||""};
    if(d.forum&&!d.topic&&d.topics&&d.topics.length)return gDraw(topicsHtml(d.topics));gDraw();};
  $("gSave").onclick=async()=>{const d=await api("/api/workshop/settings",{group:PICK});if(d&&d.ok!==false){close();take(d);}else fm((d&&d.error)||"Could not save.","bad");};
  if($("gClear"))$("gClear").onclick=async()=>{close();take(await api("/api/workshop/settings/clear",{}));};
}
const topicsHtml=T=>'<div class="hint" style="margin-top:10px">Choose the topic:</div>'+T.filter(t=>!t.closed).map(t=>'<div class="opt" data-tp="'+t.id+'" data-tt="'+esc(t.title)+'">🧵 <span>'+esc(t.title)+'</span></div>').join("");
$("sheet").addEventListener("click",async e=>{
  const g=e.target.closest("[data-g]"),tp=e.target.closest("[data-tp]");
  if(g){PICK={chat:g.dataset.g,title:g.dataset.t,topic:0,topicTitle:""};
    if(g.dataset.f==="1"){const d=await api("/api/workshop/topics",{chat:g.dataset.g});if(d.ok&&d.forum){gDraw(topicsHtml(d.topics));return;}if(!d.ok)fm(d.error,"bad");}
    gDraw();}
  if(tp){PICK.topic=Number(tp.dataset.tp)>1?Number(tp.dataset.tp):0;PICK.topicTitle=tp.dataset.tt;gDraw();}
});
$("gTest").onclick=async()=>{$("gTest").disabled=true;const d=await api("/api/workshop/test",{});$("gTest").disabled=false;say(d.ok?d.message:d.error,d.ok?"ok":"bad");};

document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!$("ov").classList.contains("on")&&!BUSY)refresh();});
refresh();
</script>
</body>
</html>
