<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMBAR Orders Sheet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f4f1ea;color:#1c2b25}
header{position:sticky;top:0;z-index:5;background:#153a2e;color:#fff;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0;flex:1 1 140px;color:#ffa939;letter-spacing:.5px}
input,select,button{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid #d6d1c7}
button{background:#b89552;color:#fff;border:0;font-weight:700;cursor:pointer}button.g{background:#188038}button.k{background:#fff;color:#153a2e}
.wrap{overflow:auto;max-height:calc(100vh - 110px);margin:10px}
table{border-collapse:collapse;background:#fff;font-size:13px;min-width:100%}
th{position:sticky;top:0;background:#153a2e;color:#fff;text-align:left;padding:8px 10px;white-space:nowrap;cursor:pointer}
td{padding:7px 10px;border-bottom:1px solid #eee9de;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr:nth-child(even) td{background:#faf8f3}
.s-Confirmed{background:#c8ebcc!important}.s-Rejected{background:#f5c7c7!important}.s-Pending{background:#fdeebc!important}
#info{padding:0 12px;font-size:13px;color:#6d675d}#msg{padding:30px;text-align:center}
</style></head><body>
<header><h1>📊 AMBAR Orders Sheet</h1>
<input id="q" placeholder="Search…" style="flex:1 1 150px">
<select id="st"><option value="">All status</option><option>Pending</option><option>Confirmed</option><option>Rejected</option></select>
<button class="g" id="dl">⬇ Download Excel</button><button id="rf">🔄</button><button class="k" onclick="location.href='/'">← Back</button></header>
<div id="info"></div><div class="wrap"><div id="msg">Loading…</div><table id="t" hidden><thead></thead><tbody></tbody></table></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const H=()=>{const h={};const d=window.Telegram?.WebApp?.initData||"";if(d)h["x-telegram-init-data"]=d;try{const k=localStorage.getItem("ownerKey");if(k)h["x-setup-key"]=k;}catch{}return h;};
let head=[],rows=[],sortCol=-1,asc=true,google="";
const $=id=>document.getElementById(id),esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const HIDE=new Set(["ID","Card Image","Product Photo","Answer Link"]); // shown in download only
async function load(){
  try{const r=await fetch("/api/sheet/orders",{headers:H()});const d=await r.json();
    if(!r.ok||!d.ok)throw Error(d.error||"Access denied. Open this page from the AMBAR bot.");
    head=d.head;rows=d.rows;google=d.google||"";$("msg").hidden=true;$("t").hidden=false;draw();
  }catch(e){$("t").hidden=true;$("msg").hidden=false;$("msg").textContent="⚠ "+e.message;}
}
function draw(){
  const q=$("q").value.trim().toLowerCase(),st=$("st").value,si=head.indexOf("Status");
  let list=rows.filter(r=>(!st||r[si]===st)&&(!q||r.join(" ").toLowerCase().includes(q)));
  if(sortCol>=0)list.sort((a,b)=>{const x=a[sortCol],y=b[sortCol],n=!isNaN(x)&&!isNaN(y)&&x!==""&&y!=="";return(n?x-y:String(x).localeCompare(String(y)))*(asc?1:-1);});
  const cols=head.map((h,i)=>i).filter(i=>!HIDE.has(head[i]));
  $("t").tHead.innerHTML="<tr>"+cols.map(i=>`<th data-i="${i}">${esc(head[i])}${sortCol===i?(asc?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  $("t").tBodies[0].innerHTML=list.map(r=>"<tr>"+cols.map(i=>`<td class="${head[i]==="Status"?"s-"+esc(r[i]):""}" title="${esc(r[i])}">${esc(r[i])}</td>`).join("")+"</tr>").join("");
  $("info").textContent=`${list.length} of ${rows.length} orders`+(google?" · ":"");
  if(google){const a=document.createElement("a");a.href=google;a.target="_blank";a.textContent="Open Google Sheet ↗";$("info").appendChild(a);}
}
$("t").tHead.addEventListener("click",e=>{const th=e.target.closest("th");if(!th)return;const i=+th.dataset.i;asc=sortCol===i?!asc:true;sortCol=i;draw();});
$("q").oninput=draw;$("st").onchange=draw;$("rf").onclick=load;
$("dl").onclick=()=>{ // Excel opens CSV directly; BOM keeps Amharic/UTF-8 text correct
  const csv=[head,...rows].map(r=>r.map(v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download="ambar-orders-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();
};
load();setInterval(load,30000);
</script></body></html>
